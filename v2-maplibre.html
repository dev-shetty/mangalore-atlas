<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mangalore Atlas v2 — MapLibre 3D</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/three@0.147.0/build/three.min.js"></script>
<style>
  :root { --panel: rgba(255,255,255,0.96); --dark: #1c2733; --accent: #ff8a3d; --muted: #6b7a88; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; color: var(--dark);
         -webkit-user-select: none; user-select: none; }
  #search { -webkit-user-select: text; user-select: text; }
  #map { position: absolute; inset: 0; }

  #sidebar { position: absolute; top: 0; left: 0; bottom: 0; width: 320px; z-index: 10;
    background: var(--panel); backdrop-filter: blur(10px); display: flex; flex-direction: column;
    border-right: 1px solid rgba(20,40,60,0.1); transition: transform 0.25s ease; }
  #sidebar.hidden { transform: translateX(-100%); }
  #sidebar header { padding: 16px 16px 8px; }
  #sidebar h1 { font-size: 20px; }
  #sidebar h1 span { color: var(--accent); }
  #sidebar .sub { font-size: 11.5px; color: var(--muted); margin-top: 4px; line-height: 1.4; }
  #search { margin: 8px 16px; padding: 9px 12px; border-radius: 8px; border: 1px solid rgba(20,40,60,0.15);
    background: #fff; font-size: 13px; outline: none; }
  #search:focus { border-color: var(--accent); }
  #filters { display: flex; flex-wrap: wrap; gap: 5px; padding: 0 16px 8px; }
  .chip { font-size: 11px; padding: 4px 9px; border-radius: 999px; cursor: pointer;
    border: 1px solid rgba(20,40,60,0.2); background: transparent; color: var(--muted); transition: all 0.15s; }
  .chip.active { color: #fff; font-weight: 600; border-color: transparent; }
  #list { flex: 1; overflow-y: auto; padding: 4px 8px 8px; }
  .item { padding: 8px 10px; border-radius: 8px; cursor: pointer; display: flex; gap: 10px; align-items: center; }
  .item:hover { background: rgba(20,40,60,0.06); }
  .item .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .item .name { font-size: 13px; }
  .item .cat { font-size: 10.5px; color: var(--muted); }
  .item .add { flex-shrink: 0; width: 24px; height: 24px; border-radius: 7px; cursor: pointer;
    border: 1px solid rgba(20,40,60,0.2); background: transparent; color: var(--muted); font-size: 14px; display: none; }
  .item:hover .add { display: block; }
  .item .add:hover { border-color: var(--accent); color: var(--accent); }
  .item .add.in { display: block; border-color: transparent; color: #2e7d32; font-weight: 700; }

  #trip { border-top: 1px solid rgba(20,40,60,0.1); padding: 10px 16px 14px; max-height: 34%; overflow-y: auto; }
  #trip h2 { font-size: 13px; color: var(--accent); margin-bottom: 6px; }
  #trip .empty { font-size: 11.5px; color: var(--muted); }
  .trip-item { display: flex; align-items: center; gap: 8px; font-size: 12.5px; padding: 4px 0; }
  .trip-item .n { flex: 1; cursor: pointer; }
  .trip-item .n:hover { color: var(--accent); }
  .trip-item .x { cursor: pointer; color: var(--muted); padding: 0 4px; }
  .trip-item .x:hover { color: #e53935; }
  #trip .trip-btns { display: flex; gap: 8px; margin-top: 8px; }
  #trip button { flex: 1; background: var(--accent); border: none; border-radius: 7px; padding: 7px 0;
    font-size: 12px; font-weight: 700; cursor: pointer; color: #fff; }
  #trip button.ghost { background: transparent; border: 1px solid rgba(20,40,60,0.2); color: var(--muted); }

  #toggle { position: absolute; top: 12px; left: 332px; z-index: 11; background: var(--panel);
    border: 1px solid rgba(20,40,60,0.15); border-radius: 8px; padding: 8px 11px; cursor: pointer;
    font-size: 14px; transition: left 0.25s ease; }
  #toggle.shifted { left: 12px; }

  #controls { position: absolute; bottom: 58px; right: 12px; z-index: 10; display: flex; flex-direction: column; gap: 8px; }
  #controls button { background: var(--panel); color: var(--dark); border: 1px solid rgba(20,40,60,0.15);
    border-radius: 8px; padding: 8px 12px; cursor: pointer; font-size: 12px; font-weight: 600; }
  #controls button:hover { border-color: var(--accent); }

  .maplibregl-popup-content { border-radius: 12px; padding: 14px 16px; max-width: 270px;
    box-shadow: 0 6px 24px rgba(20,40,60,0.35); }
  .p-title { font-weight: 800; font-size: 14px; padding-right: 12px; }
  .p-cat { font-size: 10.5px; text-transform: uppercase; letter-spacing: 1px; margin: 2px 0 6px; font-weight: 700; }
  .p-desc { font-size: 12px; color: #40505e; line-height: 1.5; }
  .p-fact { font-size: 11.5px; margin-top: 8px; padding: 7px 9px; background: rgba(255,138,61,0.1);
    border-left: 3px solid var(--accent); border-radius: 4px; line-height: 1.45; color: #533a22; }
  .p-add { margin-top: 9px; width: 100%; background: var(--accent); color: #fff; border: none;
    border-radius: 7px; padding: 7px 0; font-size: 12px; font-weight: 700; cursor: pointer; }
  .p-add:disabled { background: rgba(20,40,60,0.15); color: var(--muted); cursor: default; }

  #tripbar { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 13;
    display: none; align-items: center; gap: 10px; background: rgba(18,26,34,0.92); color: #f2ede4;
    border-radius: 12px; padding: 10px 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); backdrop-filter: blur(8px); }
  #tripbar.on { display: flex; }
  #tripbar .t-label { font-size: 13px; font-weight: 700; margin-right: 4px; }
  .s-btn { background: rgba(255,255,255,0.08); color: #f2ede4; border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px; padding: 6px 12px; font-size: 12.5px; cursor: pointer; font-weight: 600; }
  .s-btn:hover { border-color: #ff8a3d; }
  #tripbar .t-next { background: #ff8a3d; color: #14100b; border-color: transparent; }

  #story { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px);
    width: min(620px, 92vw); z-index: 14; display: none; opacity: 0; background: rgba(18,26,34,0.92);
    color: #f2ede4; border-radius: 16px; padding: 20px 24px 14px; box-shadow: 0 12px 40px rgba(0,0,0,0.45);
    backdrop-filter: blur(8px); transition: opacity 0.5s, transform 0.5s; }
  #story.on { display: block; }
  #story.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #story .s-chapter { font-size: 10.5px; letter-spacing: 2.5px; color: #ff8a3d; font-weight: 700; text-transform: uppercase; }
  #story .s-title { font-size: 21px; font-weight: 800; margin: 4px 0 8px; }
  #story .s-text { font-size: 13.5px; line-height: 1.65; color: #cfd6d3; }
  #story .s-nav { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
  #story .s-next { background: #ff8a3d; color: #14100b; border-color: transparent; }
  #story .s-exit { margin-left: auto; padding: 7px 10px; color: #98a2ab; }
  #story .s-dots { display: flex; gap: 5px; flex: 1; justify-content: center; }
  #story .s-dots span { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.22); cursor: pointer; }
  #story .s-dots span.on { background: #ff8a3d; }

  #credit { position: absolute; right: 12px; bottom: 18px; z-index: 10; display: flex; align-items: center; gap: 6px;
    background: var(--panel); border: 1px solid rgba(20,40,60,0.12); border-radius: 999px; padding: 6px 13px;
    font-size: 11px; color: var(--muted); box-shadow: 0 2px 8px rgba(20,40,60,0.15); }
  #credit a { display: flex; align-items: center; gap: 5px; color: var(--muted); text-decoration: none; }
  #credit a:hover, #credit a:hover strong { color: var(--accent); }
  #credit strong { color: var(--dark); font-weight: 700; }
  #credit .sep { color: rgba(20,40,60,0.25); }

  .marker { width: 14px; height: 14px; border-radius: 50%; border: 2.5px solid #fff; cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.45); }
  @media (max-width: 640px) { #sidebar { width: 260px; } #toggle { left: 272px; } }
</style>
</head>
<body>
<div id="map"></div>

<div id="sidebar">
  <header>
    <h1>Mangalore <span>Atlas</span> <small style="font-size:11px;color:var(--muted)">v2 · MapLibre</small></h1>
    <div class="sub">Real map tiles + 3D extruded buildings &amp; terrain. Drag to pan, right-drag to tilt &amp; rotate.</div>
  </header>
  <input id="search" type="text" placeholder="Search landmarks…" />
  <div id="filters"></div>
  <div id="list"></div>
  <div id="trip">
    <h2>🧳 My Trip <span id="tripCount"></span></h2>
    <div id="tripList"><div class="empty">Click "＋" or "Add to trip" on any landmark to plan your itinerary.</div></div>
    <div class="trip-btns" id="tripBtns" style="display:none">
      <button id="btnTripTour">▶ Tour my trip</button>
      <button id="btnTripClear" class="ghost">Clear</button>
    </div>
  </div>
</div>
<button id="toggle" title="Toggle sidebar">☰</button>

<div id="controls">
  <button id="btnStory" style="border-color:#ff8a3d;font-weight:700">📖 Story Mode</button>
  <button id="btnTour">✈ Fly Tour</button>
  <button id="btn3d">3D View</button>
  <button id="btnTop">Top View</button>
  <button id="btnHome">⌂ Reset View</button>
</div>

<div id="tripbar">
  <span class="t-label"></span>
  <button class="s-btn t-prev">◀</button>
  <button class="s-btn t-next">Next ▶</button>
  <button class="s-btn t-end">✕ End</button>
</div>

<div id="story">
  <div class="s-chapter"></div>
  <div class="s-title"></div>
  <div class="s-text"></div>
  <div class="s-nav">
    <button class="s-btn s-prev">◀ Back</button>
    <div class="s-dots"></div>
    <button class="s-btn s-next">Next ▶</button>
    <button class="s-btn s-exit" title="Exit story">✕</button>
  </div>
</div>

/* ============================ MAP ============================ */
const map = new maplibregl.Map({
  container: "map",
  style: "https://tiles.openfreemap.org/styles/liberty",
  center: CITY_CENTER,
  zoom: 13.2,
  pitch: 60,
  bearing: -15,
  antialias: true,
  maxPitch: 78,
  maxBounds: [[74.50, 12.55], [75.22, 13.48]],  // keep the camera on greater Mangalore
  minZoom: 9.4,
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "top-right");
map.addControl(new maplibregl.ScaleControl(), "bottom-left");

map.on("load", () => {
  // NOTE: no 3D terrain here — MapLibre custom layers jitter/float when terrain
  // is enabled (float32 matrix precision), so v2 keeps the ground flat and stable.
  map.setSky && map.setSky({ "sky-color": "#87ceeb", "horizon-color": "#f0e6d2", "fog-color": "#e8e0d8", "sky-horizon-blend": 0.6 });

  // fill-extrusion: turn OSM building polygons into 3D blocks
  const layers = map.getStyle().layers;
  const labelLayer = layers.find((l) => l.type === "symbol" && l.layout && l.layout["text-field"]);
  try {
    map.addLayer({
      id: "3d-buildings",
      source: "openmaptiles",
      "source-layer": "building",
      type: "fill-extrusion",
      minzoom: 14,
      paint: {
        "fill-extrusion-color": [
          "interpolate", ["linear"], ["coalesce", ["get", "render_height"], 10],
          0, "#d8cfc0", 25, "#c4b8a4", 60, "#a8988a",
        ],
        "fill-extrusion-height": ["coalesce", ["get", "render_height"], 10],
        "fill-extrusion-base": ["coalesce", ["get", "render_min_height"], 0],
        "fill-extrusion-opacity": 0.85,
      },
    }, labelLayer && labelLayer.id);
  } catch (e) { console.warn("3D buildings unavailable:", e); }

  map.addLayer(modelLayer);

  // vibrancy pass: saturate the muted liberty palette (greens, sand, water, roads)
  const paint = (id, prop, val) => { try { map.setPaintProperty(id, prop, val); } catch (e) {} };
  paint("background", "background-color", "#f2ead6");
  paint("water", "fill-color", "#2f83c5");
  paint("waterway_river", "line-color", "#2f83c5");
  paint("waterway_other", "line-color", "#2f83c5");
  paint("park", "fill-color", "#a9d78f");
  paint("landcover_grass", "fill-color", "#a9d78f");
  paint("landcover_wood", "fill-color", "#7cb56a");
  paint("landuse_pitch", "fill-color", "#8fcf7e");
  paint("landcover_sand", "fill-color", "#f6d998");
  paint("landuse_residential", "fill-color", "#ede2cb");
  paint("landuse_school", "fill-color", "#f3e4c3");
  paint("landuse_hospital", "fill-color", "#f5dede");
  paint("road_motorway", "line-color", "#f59a4d");
  paint("road_trunk_primary", "line-color", "#f6ad63");
  paint("road_secondary_tertiary", "line-color", "#fbd07f");
  paint("road_minor", "line-color", "#ffffff");
  paint("road_minor_casing", "line-color", "#b9c0c9");

/* ==================== CUSTOM 3D LANDMARK MODELS (Three.js layer) ==================== */
const ANIMATED = [];
const M = (c) => new THREE.MeshLambertMaterial({ color: c });
function box(w, h, d, c, x = 0, y = 0, z = 0) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), M(c)); m.position.set(x, y + h / 2, z); return m; }
function cyl(rt, rb, h, c, x = 0, y = 0, z = 0, seg = 12) { const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), M(c)); m.position.set(x, y + h / 2, z); return m; }
function cone(r, h, c, x = 0, y = 0, z = 0, seg = 12, rotY = 0) { const m = new THREE.Mesh(new THREE.ConeGeometry(r, h, seg), M(c)); m.position.set(x, y + h / 2, z); m.rotation.y = rotY; return m; }
function sph(r, c, x = 0, y = 0, z = 0) { const m = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 9), M(c)); m.position.set(x, y, z); return m; }
function dome(r, c, x = 0, y = 0, z = 0) { const m = new THREE.Mesh(new THREE.SphereGeometry(r, 14, 9, 0, Math.PI * 2, 0, Math.PI / 2), M(c)); m.position.set(x, y, z); return m; }
function palm(x, z, h = 9) {
  const g = new THREE.Group();
  const t = cyl(0.35, 0.55, h, 0x8d6e63, 0, 0, 0, 6); t.rotation.z = 0.12; g.add(t);
  for (let i = 0; i < 6; i++) {
    const leaf = box(5.5, 0.2, 1.3, 0x2e7d32);
    leaf.position.set(Math.cos((i / 6) * Math.PI * 2) * 2.4 + h * 0.12, h + 0.4, Math.sin((i / 6) * Math.PI * 2) * 2.4);
    leaf.rotation.y = -(i / 6) * Math.PI * 2; leaf.rotation.z = 0.35;
    g.add(leaf);
  }
  g.position.set(x, 0, z);
  return g;
}
function treeM(x, z, s = 1) { const g = new THREE.Group(); g.add(cyl(0.5 * s, 0.7 * s, 4 * s, 0x795548, 0, 0, 0, 6)); g.add(sph(3.2 * s, 0x388e3c, 0, 5.5 * s, 0)); g.position.set(x, 0, z); return g; }
function kalasha(x, y, z, s = 1) { const g = new THREE.Group(); g.add(cyl(0.35 * s, 0.5 * s, 1.6 * s, 0xffd54f, x, y, z, 8)); g.add(sph(0.55 * s, 0xffd54f, x, y + 2 * s, z)); return g; }

const BUILDERS = {
  // Tulu-nadu temple: walled prakara with tiled top, gatehouse, inner sanctum
  // with stacked copper pyramid roofs and a golden sthupi — like Kadri/Sharavu/Mangaladevi
  temple() {
    const g = new THREE.Group();
    g.add(box(48, 1, 48, 0xcabf9f, 0, -0.5, 0));                     // courtyard
    // prakara (compound) wall with terracotta tiled coping
    [[0, -23, 46, 3], [0, 23, 46, 3], [-23, 0, 3, 46], [23, 0, 3, 46]].forEach(([x, z, w, d]) => {
      g.add(box(w, 3.2, d, 0xf2ead6, x, 0, z));
      const tile = box(w + 0.8, 0.7, d + 0.8, 0xa0522d, x, 3.2, z);
      g.add(tile);
    });
    // gatehouse (padipura) with its own little two-tier tiled roof
    g.add(box(8, 5.5, 4, 0xf2ead6, 0, 0, 23));
    const gr1 = cone(6.4, 3, 0xa0522d, 0, 5.5, 23, 4, Math.PI / 4); gr1.scale.z = 0.62; g.add(gr1);
    const gr2 = cone(3.6, 2.4, 0x8c5a2b, 0, 8.2, 23, 4, Math.PI / 4); gr2.scale.z = 0.62; g.add(gr2);
    // pillared outer mantapa ring
    g.add(box(30, 4.5, 30, 0xf7f3e8, 0, 0, 0));
    const mr = cone(23, 5.5, 0xa0522d, 0, 4.5, 0, 4, Math.PI / 4); mr.scale.y = 0.75; g.add(mr);
    // inner sanctum (garbhagriha) rising through, with two copper pyramid tiers
    g.add(box(15, 10, 15, 0xf7f3e8, 0, 2, 0));
    g.add(cone(12, 5.5, 0x8c5a2b, 0, 12, 0, 4, Math.PI / 4));
    g.add(cone(7.5, 5, 0xb87333, 0, 17, 0, 4, Math.PI / 4));
    g.add(box(8.5, 0.8, 8.5, 0xffd54f, 0, 16.6, 0));                 // gold band between tiers
    g.add(kalasha(0, 22.2, 0, 1.5));
    // gold-clad dhwaja sthamba (flag pillar) + balipeeta
    g.add(cyl(0.55, 0.7, 15, 0xffd54f, 0, 1, 13, 8), box(2.2, 1.6, 2.2, 0x8d6e63, 0, 1, 8.5));
    // deepa sthambha (lamp pillar) by the gate
    g.add(cyl(0.4, 0.6, 7, 0x6d5843, 7, 1, 19, 6), sph(0.7, 0xffb300, 7, 8.8, 19));
    return g;
  },
  // Kadri Manjunath complex: tiered temple + nine ponds + Kadri Park + hilltop Shiva statue & caves
  kadri() {
    const g = new THREE.Group();
    g.add(BUILDERS.temple());

    // the nine sacred spring-fed ponds, terraced behind (east of) the temple
    const pondPos = [[-26, -26], [-14, -28], [-2, -27], [10, -28], [22, -26], [-20, -38], [-6, -39], [8, -38], [20, -37]];
    pondPos.forEach(([x, z], i) => {
      const rim = new THREE.Mesh(new THREE.CylinderGeometry(4.6, 4.6, 1.4, 10), M(0xcfc4a4));
      rim.position.set(x, 0.7, z); g.add(rim);
      const wtr = new THREE.Mesh(new THREE.CylinderGeometry(3.8, 3.8, 0.5, 10), M(i % 2 ? 0x4fc3f7 : 0x39a9db));
      wtr.position.set(x, 1.35, z); g.add(wtr);
    });
    // stepped ghat down to the main pond
    for (let i = 0; i < 3; i++) g.add(box(14, 1, 2.2, 0xd7ccc8, -2, i, -21 + i * 2));

    // Kadri Park in front: lawn, trees, musical fountain
    const lawn = new THREE.Mesh(new THREE.CylinderGeometry(17, 17, 0.7, 14), M(0x7cb342));
    lawn.position.set(-34, 0.35, 22); g.add(lawn);
    g.add(treeM(-42, 14), treeM(-26, 16, 1.15), treeM(-44, 28), treeM(-30, 32, 1.2), treeM(-38, 22, 0.9));
    g.add(cyl(2.6, 3.2, 1.2, 0x90a4ae, -34, 0.7, 22, 12), cone(0.8, 4, 0x81d4fa, -34, 1.9, 22, 8));

    // hilltop mound with the tall seated Shiva statue overlooking the temple
    const mound = cone(16, 10, 0x8fae62, 34, 0, -18, 9); mound.scale.y = 0.9; g.add(mound);
    const st = new THREE.Group();
    st.add(cyl(6, 7, 1.8, 0xf5f0e6, 0, 0, 0, 10));                            // plinth
    const lotus = cyl(4.6, 3.4, 1.6, 0xf8bbd0, 0, 1.8, 0, 10); st.add(lotus); // lotus seat
    const legs = sph(3.4, 0x9fb9d0, 0, 4.6, 0); legs.scale.set(1.35, 0.55, 1); st.add(legs); // crossed legs
    const torso = cyl(1.9, 2.6, 5, 0x9fb9d0, 0, 5.4, 0, 10); st.add(torso);
    [[-1, 1], [1, -1]].forEach(([sx]) => {                                     // arms resting on knees
      const arm = cyl(0.55, 0.55, 4.2, 0x9fb9d0, sx * 2.6, 5.2, 0.8, 8);
      arm.rotation.z = sx * 0.5; st.add(arm);
    });
    st.add(sph(1.5, 0x9fb9d0, 0, 11.6, 0));                                    // head
    st.add(cone(0.9, 1.8, 0x37474f, 0, 12.6, 0, 8));                           // jata (hair knot)
    st.add(cyl(0.09, 0.09, 3.4, 0xffd54f, 1.6, 8.4, 0.4, 6));                  // trishul shaft
    [[-0.5], [0], [0.5]].forEach(([dx]) => st.add(cone(0.16, 1.1, 0xffd54f, 1.6 + dx * 0.5, 11.8, 0.4, 6)));
    st.position.set(34, 8.2, -18);
    st.rotation.y = -2.2; // gazing down over the temple
    g.add(st);

    // Pandava cave mouths in the hillside
    [[24, -26], [42, -24]].forEach(([x, z]) => {
      const cave = new THREE.Mesh(new THREE.SphereGeometry(2.6, 8, 6, 0, Math.PI * 2, 0, Math.PI / 2), M(0x4e4038));
      cave.position.set(x, 0.4, z); g.add(cave);
    });
    return g;
  },
  // Kudroli Gokarnanatha: Chola-style — white stepped gopuram tower with gold
  // ornament bands, barrel-vault gold shikhara, flanking shrines, walled court
  gopuram() {
    const g = new THREE.Group();
    g.add(box(64, 1, 48, 0xe8e8e8, 0, -0.5, 0));                     // paved court
    [[0, -23, 62, 2.5], [0, 23, 62, 2.5], [-31, 0, 2.5, 46], [31, 0, 2.5, 46]].forEach(([x, z, w, d]) =>
      g.add(box(w, 2.8, d, 0xfafafa, x, 0, z)));
    // main gopuram: five tapering white tiers with gold trim lines
    const tiers = [[26, 6, 16], [22, 5, 13.5], [18, 4.5, 11], [14, 4, 9], [10.5, 3.5, 7]];
    let y = 0;
    tiers.forEach(([w, h, d], i) => {
      g.add(box(w, h, d, i % 2 ? 0xf5f5f5 : 0xffffff, 0, y, 0));
      y += h;
      g.add(box(w - 1, 0.6, d - 1, 0xffc107, 0, y - 0.3, 0));        // gold band
    });

  [74.853, 12.848], [74.8425, 12.8455], [74.8425, 12.836], [74.845, 12.824], [74.8455, 12.807],
  [74.841, 12.780], [74.841, 12.745],
];

const toLocal = (lng, lat) => {
  const m = maplibregl.MercatorCoordinate.fromLngLat({ lng, lat }, 0);
  return { x: (m.x - refMerc.x) / s0, z: (m.y - refMerc.y) / s0 };
};
function buildPathV(ptsLL) {
  const path = [];
  const pts = ptsLL.map(([lng, lat]) => toLocal(lng, lat));
  let acc = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    const segLen = Math.hypot(b.x - a.x, b.z - a.z);
    const n = Math.max(2, Math.ceil(segLen / 180));
    for (let j = 0; j < n; j++) {
      path.push({ x: a.x + ((b.x - a.x) * j) / n, z: a.z + ((b.z - a.z) * j) / n, d: acc });
      acc += segLen / n;
    }
  }
  path.total = acc;
  return path;
}
function placeOnPathV(path, frac, lane) {
  const d = frac * path.total;
  let lo = 0, hi = path.length - 1;
  while (lo < hi - 1) { const m = (lo + hi) >> 1; path[m].d <= d ? (lo = m) : (hi = m); }
  const a = path[lo], b = path[Math.min(lo + 1, path.length - 1)];
  const t = Math.min(1, (d - a.d) / Math.max(1, b.d - a.d));
  const dx = b.x - a.x, dz = b.z - a.z, len = Math.hypot(dx, dz) || 1;
  return { x: a.x + dx * t - (dz / len) * lane, z: a.z + dz * t + (dx / len) * lane, rot: Math.atan2(dx, dz) };
}
const NH_PATH_V = buildPathV(NH66_PTS);
const CITY_PATH_V = buildPathV([[74.8395, 12.8655], [74.8434, 12.8691], [74.8480, 12.8830], [74.8556, 12.8859], [74.868, 12.920], [74.8890, 12.9610]]);

const vehicles = [];
let ferryV = null, shipsV = [];
const FA_V = toLocal(74.8225, 12.8840), FB_V = toLocal(74.8135, 12.8852);

function busMeshV(c1, c2) {
  const bus = new THREE.Group();
  bus.add(box(10, 3.8, 2.5, c1));
  bus.add(box(10.2, 1.1, 2.55, c2, 0, 1.2, 0));
  bus.add(box(9.4, 1.2, 2.6, 0x263238, 0, 2.5, 0));
  bus.add(box(0.4, 2.6, 2.3, 0x263238, 5, 0.5, 0));
  bus.scale.setScalar(2.4);
  return bus;
}
function buildVehicles(scene) {
  // cars on NH-66
  [0xd32f2f, 0xfafafa, 0x1565c0, 0xf9a825, 0x37474f, 0x2e7d32].forEach((c, i) => {
    const car = new THREE.Group();
    car.add(box(5, 2.2, 2.4, c), box(2.6, 1.6, 2.2, c, -0.3, 2.2, 0));
    car.scale.setScalar(2.2);
    scene.add(car);
    vehicles.push({ mesh: car, path: NH_PATH_V, off: i / 6, dir: i % 2 ? 1 : -1, lane: i % 2 ? 9 : -9, speed: 240 + (i % 3) * 50 });
  });
  // rampaging private buses on NH-66
  [[0xc62828, 0xffeb3b], [0xf9a825, 0x2e7d32], [0x1565c0, 0xffffff], [0xef6c00, 0xffffff], [0x6a1b9a, 0xffca28]].forEach(([c1, c2], i) => {
    const bus = busMeshV(c1, c2);
    scene.add(bus);
    vehicles.push({ mesh: bus, path: NH_PATH_V, off: i / 5 + 0.09, dir: i % 2 ? 1 : -1, lane: i % 2 ? 13 : -13, speed: 430 + (i % 3) * 80 });
  });
  // city-route buses: State Bank -> Bejai -> Kadri -> airport
  [[0xc62828, 0xffffff], [0x2e7d32, 0xffeb3b], [0x1565c0, 0xffca28]].forEach(([c1, c2], i) => {
    const bus = busMeshV(c1, c2);
    scene.add(bus);
    vehicles.push({ mesh: bus, path: CITY_PATH_V, off: i / 3, dir: i % 2 ? 1 : -1, lane: i % 2 ? 8 : -8, speed: 360 + i * 60 });
  });
  // Sultan Battery <-> Tannirbhavi ferry
  ferryV = new THREE.Group();
  ferryV.add(box(14, 3, 5, 0xff8f00), box(5, 3.5, 4, 0xfffde7, 0, 3, 0));
  ferryV.scale.setScalar(2.6);
  scene.add(ferryV);
  // cargo ships steaming along the coast toward NMPT
  [[74.775, 13.02, 0x37474f], [74.760, 12.80, 0x5d4037]].forEach(([lng, lat, c]) => {
    const sPos = toLocal(lng, lat);
    const ship = new THREE.Group();
    ship.add(box(30, 4, 8, c), box(5, 6, 7, 0xeceff1, -9, 4, 0));
    for (let i = 0; i < 3; i++) ship.add(box(5, 2.2, 6, [0xe53935, 0x43a047, 0xfb8c00][i], 2 + i * 5.6, 4, 0));
    ship.scale.setScalar(3.4);
    ship.position.set(sPos.x, 0, sPos.z);
    scene.add(ship);
    shipsV.push(ship);
  });
}
function animateVehicles(t) {
  vehicles.forEach((v) => {
    const frac = ((v.off + v.dir * t * v.speed / v.path.total) % 1 + 1) % 1;
    const pOn = placeOnPathV(v.path, frac, v.lane);
    v.mesh.position.set(pOn.x, 0, pOn.z);
    v.mesh.rotation.y = pOn.rot + (v.dir > 0 ? 0 : Math.PI) + Math.PI / 2;
  });
  if (ferryV) {
    const ft = (Math.sin(t * 0.15) + 1) / 2;
    ferryV.position.set(FA_V.x + (FB_V.x - FA_V.x) * ft, 0, FA_V.z + (FB_V.z - FA_V.z) * ft);
    ferryV.rotation.y = Math.atan2(FB_V.x - FA_V.x, FB_V.z - FA_V.z) + (Math.cos(t * 0.15) > 0 ? 0 : Math.PI);
  }
  shipsV.forEach((sh, i) => {
    sh.position.z += (i ? -1 : 1) * 1.4;
    if (sh.position.z > 24000) sh.position.z = -34000;
    if (sh.position.z < -34000) sh.position.z = 24000;
  });
}

const modelLayer = {
  id: "landmark-models",
  type: "custom",
  renderingMode: "3d",
  onAdd(mapp, gl) {
    this.camera = new THREE.Camera();
    this.scene = new THREE.Scene();
    this.scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const sun = new THREE.DirectionalLight(0xfff2d9, 0.9);
    sun.position.set(120, 200, 80);
    this.scene.add(sun);
    LANDMARKS.forEach((l, i) => {
      const builder = BUILDERS[l.model];
      if (!builder) return;
      const grp = builder();
      grp.scale.setScalar(LM_SCALE * (l.mScale || 1));
      const m = maplibregl.MercatorCoordinate.fromLngLat({ lng: l.lng, lat: l.lat }, 0);
      grp.position.set((m.x - refMerc.x) / s0, 0, (m.y - refMerc.y) / s0);
      grp.rotation.y = ((l.lng * 997) % 1.2) - 0.6;
      this.scene.add(grp);
      modelEntries.push({ group: grp, landmark: l, idx: i });
    });
    buildVehicles(this.scene);
    this.renderer = new THREE.WebGLRenderer({ canvas: mapp.getCanvas(), context: gl, antialias: true });
    this.renderer.autoClear = false;
  },
  render(gl, matrix) {
    const t = performance.now() / 1000;
    ANIMATED.forEach((o) => {
      if (o.userData.wheel) {
        o.rotation.z = t * 0.35;
        o.children.forEach((ch) => { if (ch.userData.cab) ch.rotation.z = -o.rotation.z; });
      }
      if (o.userData.kite) {
        o.position.y = o.userData.kite.baseY + Math.sin(t * 1.3 + o.userData.kite.phase) * 3;
        o.rotation.z = Math.sin(t * 0.9 + o.userData.kite.phase) * 0.35;
      }
      if (o.userData.flame) o.scale.y = 1 + Math.sin(t * 7) * 0.25;
    });
    animateVehicles(t);
    const m = new THREE.Matrix4().fromArray(matrix);
    const l = new THREE.Matrix4()
      .makeTranslation(refMerc.x, refMerc.y, refMerc.z)
      .scale(new THREE.Vector3(s0, -s0, s0))
      .multiply(new THREE.Matrix4().makeRotationX(Math.PI / 2));
    this.camera.projectionMatrix = m.multiply(l);
    this.renderer.resetState();
    this.renderer.render(this.scene, this.camera);
    map.triggerRepaint();
  },
};


/* ==================== MARKERS & POPUPS ==================== */
const trip = [];
const markers = [];

function popupHTML(l, idx) {
  const c = CATEGORIES[l.cat];
  const inTrip = trip.includes(idx);
  return `<div class="p-title">${l.name}</div>
    <div class="p-cat" style="color:${c.color}">${c.icon} ${c.label}</div>
    <div class="p-desc">${l.desc}</div>
    ${l.fact ? `<div class="p-fact">💡 ${l.fact}</div>` : ""}
    <button class="p-add" onclick="addToTrip(${idx})" ${inTrip ? "disabled" : ""}>${inTrip ? "✓ In your trip" : "＋ Add to trip"}</button>`;
}

LANDMARKS.forEach((l, i) => {
  const el = document.createElement("div");
  el.className = "marker";
  el.style.background = CATEGORIES[l.cat].color;
  const popup = new maplibregl.Popup({ offset: 16 });
  popup.on("open", () => popup.setHTML(popupHTML(l, i)));
  const marker = new maplibregl.Marker({ element: el })
    .setLngLat([l.lng, l.lat])
    .setPopup(popup)
    .addTo(map);
  markers.push(marker);
});

window.addToTrip = (idx) => {
  if (!trip.includes(idx)) trip.push(idx);
  renderTrip();
  const p = markers[idx].getPopup();
  if (p.isOpen()) p.setHTML(popupHTML(LANDMARKS[idx], idx));
};

function closeAllPopups() {
  markers.forEach((m) => m.getPopup().isOpen() && m.togglePopup());
}
function flyToLandmark(idx, open = true) {
  const l = LANDMARKS[idx];
  map.flyTo({ center: [l.lng, l.lat], zoom: 16.2, pitch: 62, bearing: ((idx * 53) % 90) - 45, duration: 2400, essential: true });
  if (open) { closeAllPopups(); setTimeout(() => markers[idx].togglePopup(), 2300); }
}

/* ==================== SIDEBAR ==================== */
const activeCats = new Set(Object.keys(CATEGORIES));
let searchTerm = "";
const visible = () => LANDMARKS.map((l, i) => i).filter((i) =>
  activeCats.has(LANDMARKS[i].cat) && LANDMARKS[i].name.toLowerCase().includes(searchTerm));

const filtersEl = document.getElementById("filters");
Object.entries(CATEGORIES).forEach(([key, c]) => {
  const chip = document.createElement("button");
  chip.className = "chip active";
  chip.textContent = c.label;
  chip.style.background = c.color;
  chip.onclick = () => {
    if (activeCats.has(key)) { activeCats.delete(key); chip.classList.remove("active"); chip.style.background = "transparent"; }
    else { activeCats.add(key); chip.classList.add("active"); chip.style.background = c.color; }
    refresh();
  };
  filtersEl.appendChild(chip);
});

const listEl = document.getElementById("list");
function refresh() {
  listEl.innerHTML = "";
  const vis = new Set(visible());
  modelEntries.forEach((e) => { e.group.visible = vis.has(e.idx); });
  map.triggerRepaint && map.triggerRepaint();
  LANDMARKS.forEach((l, i) => {
    markers[i].getElement().style.display = vis.has(i) ? "" : "none";
    if (!vis.has(i)) return;
    const item = document.createElement("div");
    item.className = "item";
    const inTrip = trip.includes(i);
    item.innerHTML = `<span class="dot" style="background:${CATEGORIES[l.cat].color}"></span>
      <span style="flex:1"><div class="name">${l.name}</div><div class="cat">${CATEGORIES[l.cat].label}</div></span>
      <button class="add${inTrip ? " in" : ""}">${inTrip ? "✓" : "＋"}</button>`;
    item.onclick = () => flyToLandmark(i);
    const addBtn = item.querySelector(".add");
    addBtn.onclick = (e) => { e.stopPropagation(); window.addToTrip(i); };
    listEl.appendChild(item);
  });
}
document.getElementById("search").addEventListener("input", (e) => { searchTerm = e.target.value.toLowerCase(); refresh(); });

/* ==================== TRIP PLANNER + TOUR BAR ==================== */
function renderTrip() {
  const listT = document.getElementById("tripList");
  const btns = document.getElementById("tripBtns");
  document.getElementById("tripCount").textContent = trip.length ? `(${trip.length})` : "";
  if (!trip.length) {
    listT.innerHTML = '<div class="empty">Click "＋" or "Add to trip" on any landmark to plan your itinerary.</div>';
    btns.style.display = "none";
    refresh();
    return;
  }
  btns.style.display = "flex";
  listT.innerHTML = "";
  trip.forEach((idx, order) => {
    const l = LANDMARKS[idx];
    const row = document.createElement("div");
    row.className = "trip-item";
    row.innerHTML = `<span style="width:8px;height:8px;border-radius:50%;background:${CATEGORIES[l.cat].color}"></span>
      <span class="n">${order + 1}. ${l.name}</span><span class="x">✕</span>`;
    row.querySelector(".n").onclick = () => flyToLandmark(idx);
    row.querySelector(".x").onclick = () => { trip.splice(order, 1); renderTrip(); };
    listT.appendChild(row);
  });
  refresh();
}
document.getElementById("btnTripClear").onclick = () => { trip.length = 0; renderTrip(); };

let tripActive = false, tripPos = 0;
const tripBar = document.getElementById("tripbar");
const tripTourBtn = document.getElementById("btnTripTour");
function tripGo(i) {
  tripPos = Math.max(0, Math.min(trip.length - 1, i));
  flyToLandmark(trip[tripPos]);
  tripBar.querySelector(".t-label").textContent = `Stop ${tripPos + 1} of ${trip.length} · ${LANDMARKS[trip[tripPos]].name}`;
  tripBar.querySelector(".t-prev").style.visibility = tripPos ? "visible" : "hidden";
  tripBar.querySelector(".t-next").textContent = tripPos === trip.length - 1 ? "Finish ✓" : "Next ▶";
}
function stopTripTour() {
  if (!tripActive) return;
  tripActive = false;
  tripBar.classList.remove("on");
  tripTourBtn.textContent = "▶ Tour my trip";
}
tripTourBtn.onclick = () => {
  if (tripActive) return stopTripTour();
  if (!trip.length) return;
  tripActive = true;
  tripTourBtn.textContent = "■ End tour";
  tripBar.classList.add("on");
  tripGo(0);
};
tripBar.querySelector(".t-next").onclick = () => (tripPos >= trip.length - 1 ? stopTripTour() : tripGo(tripPos + 1));
tripBar.querySelector(".t-prev").onclick = () => tripGo(tripPos - 1);
tripBar.querySelector(".t-end").onclick = stopTripTour;

/* ==================== FLY TOUR & VIEW CONTROLS ==================== */
let tourActive = false, tourIdx = 0, tourTimer = null;
const tourBtn = document.getElementById("btnTour");
function stopTour() { if (!tourActive) return; tourActive = false; clearTimeout(tourTimer); tourBtn.textContent = "✈ Fly Tour"; }
function tourStep() {
  if (!tourActive) return;
  const vis = visible();
  if (!vis.length) return stopTour();
  flyToLandmark(vis[tourIdx % vis.length]);
  tourIdx++;
  tourTimer = setTimeout(tourStep, 7000);
}
tourBtn.onclick = () => { if (tourActive) return stopTour(); tourActive = true; tourBtn.textContent = "■ Stop Tour"; tourStep(); };
map.on("mousedown", () => { stopTour(); });

document.getElementById("btn3d").onclick = () => map.easeTo({ pitch: 62, duration: 1000 });
document.getElementById("btnTop").onclick = () => map.easeTo({ pitch: 0, bearing: 0, duration: 1000 });
document.getElementById("btnHome").onclick = () => { stopTour(); map.flyTo({ center: CITY_CENTER, zoom: 13.2, pitch: 60, bearing: -15, duration: 1800 }); };

/* ==================== STORY MODE ==================== */
const STORY = [
  { at: "Kadri Manjunath Temple", title: "Dawn on Kadri Hill", dist: 900,

  { at: "Clock Tower, Hampankatta", title: "The City Wakes at the Clock Tower", dist: 750,
    text: "By nine, Hampankatta is a swirl of private buses in racing liveries, each conductor whistling a language only Kudla understands. Everything in Mangalore is measured from this roundabout — and everyone has said 'clock tower bali sigana' at least once." },

];

const storyEl = document.getElementById("story");
const sDots = storyEl.querySelector(".s-dots");
STORY.forEach((_, i) => { const d = document.createElement("span"); d.onclick = () => storyChapter(i); sDots.appendChild(d); });
let storyIdx = -1, storyOn = false, storySpin = null;
function storyChapter(i) {
  storyIdx = i;
  const ch = STORY[i];
  const li = LANDMARKS.findIndex((l) => l.name === ch.at);
  clearInterval(storySpin);
  if (li >= 0) {
    const l = LANDMARKS[li];
    closeAllPopups();
    map.flyTo({ center: [l.lng, l.lat], zoom: 16.4, pitch: 64, bearing: (i * 63) % 360 - 180, duration: 3200, essential: true });
    // slow cinematic rotation once we arrive
    setTimeout(() => { if (storyOn && storyIdx === i) storySpin = setInterval(() => map.rotateTo(map.getBearing() + 0.06, { duration: 50 }), 50); }, 3300);
  }
  storyEl.classList.remove("show");
  setTimeout(() => {
    storyEl.querySelector(".s-chapter").textContent = `Chapter ${i + 1} of ${STORY.length} · A Day in Kudla`;
    storyEl.querySelector(".s-title").textContent = ch.title;
    storyEl.querySelector(".s-text").textContent = ch.text;
    storyEl.querySelector(".s-prev").style.visibility = i ? "visible" : "hidden";
    storyEl.querySelector(".s-next").textContent = i === STORY.length - 1 ? "Finish ✓" : "Next ▶";
    [...sDots.children].forEach((d, k) => d.classList.toggle("on", k === i));
    storyEl.classList.add("show");
  }, 450);
}
function startStory() {
  storyOn = true;
  stopTour(); stopTripTour();
  sidebar.classList.add("hidden");
  toggleBtn.classList.add("shifted");
  storyEl.classList.add("on");
  storyChapter(0);
}
function exitStory() {
  storyOn = false;
  clearInterval(storySpin);
  storyEl.classList.remove("show");
  setTimeout(() => storyEl.classList.remove("on"), 400);
  sidebar.classList.remove("hidden");
  toggleBtn.classList.remove("shifted");
  map.flyTo({ center: CITY_CENTER, zoom: 13.2, pitch: 60, bearing: -15, duration: 2200 });
}
document.getElementById("btnStory").onclick = () => (storyOn ? exitStory() : startStory());
storyEl.querySelector(".s-next").onclick = () => (storyIdx >= STORY.length - 1 ? exitStory() : storyChapter(storyIdx + 1));
storyEl.querySelector(".s-prev").onclick = () => storyIdx > 0 && storyChapter(storyIdx - 1);
storyEl.querySelector(".s-exit").onclick = exitStory;
map.on("mousedown", () => clearInterval(storySpin));
addEventListener("keydown", (e) => {
  if (storyOn) {
    if (e.key === "ArrowRight" || e.key === "Enter") storyEl.querySelector(".s-next").click();
    if (e.key === "ArrowLeft") storyEl.querySelector(".s-prev").click();
    if (e.key === "Escape") exitStory();
  } else if (tripActive) {
    if (e.key === "ArrowRight" || e.key === "Enter") tripBar.querySelector(".t-next").click();
    if (e.key === "ArrowLeft") tripBar.querySelector(".t-prev").click();
    if (e.key === "Escape") stopTripTour();
  }
});

/* ==================== SIDEBAR TOGGLE ==================== */
const sidebar = document.getElementById("sidebar");
const toggleBtn = document.getElementById("toggle");
toggleBtn.onclick = () => { sidebar.classList.toggle("hidden"); toggleBtn.classList.toggle("shifted"); };

refresh();
