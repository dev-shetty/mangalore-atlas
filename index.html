<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mangalore Atlas — 3D World</title>
<script src="https://unpkg.com/three@0.147.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="miniature.js"></script>
<style>
  :root {
    --panel: rgba(255, 255, 255, 0.96);
    --dark: #1c2733;
    --accent: #ff8a3d;
    --muted: #6b7a88;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; background: #a8d8ef; color: var(--dark); -webkit-user-select: none; user-select: none; }
  #search { -webkit-user-select: text; user-select: text; }
  #scene { position: absolute; inset: 0; }
  #labels { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }

  .pill {
    position: absolute; transform: translate(-50%, -130%);
    background: var(--panel); border-radius: 10px; padding: 5px 10px 5px 7px;
    font-size: 12px; font-weight: 600; white-space: nowrap; cursor: pointer;
    box-shadow: 0 2px 8px rgba(20,40,60,0.25), 0 0 0 1px rgba(20,40,60,0.06);
    pointer-events: auto; display: flex; align-items: center; gap: 5px;
    transition: box-shadow 0.15s;
  }
  .pill:hover { box-shadow: 0 4px 14px rgba(20,40,60,0.35), 0 0 0 2px var(--accent); z-index: 5; }
  .pill .ic { font-size: 13px; }
  .area {
    position: absolute; transform: translate(-50%, -50%); pointer-events: none;
    color: #6f7a84; font-size: 10px; font-weight: 700; letter-spacing: 2.5px;
    text-shadow: 0 1px 3px rgba(255,255,255,0.7); white-space: nowrap;
  }
  .pill::after {
    content: ""; position: absolute; left: 50%; bottom: -5px; transform: translateX(-50%);
    border: 5px solid transparent; border-top-color: var(--panel); border-bottom: none;
  }

  #sidebar {
    position: absolute; top: 0; left: 0; bottom: 0; width: 320px; z-index: 10;
    background: var(--panel); backdrop-filter: blur(10px);
    display: flex; flex-direction: column;
    border-right: 1px solid rgba(20,40,60,0.1);
    transition: transform 0.25s ease;
  }
  #sidebar.hidden { transform: translateX(-100%); }
  #sidebar header { padding: 16px 16px 8px; }
  #sidebar h1 { font-size: 20px; }
  #sidebar h1 span { color: var(--accent); }
  #sidebar .sub { font-size: 11.5px; color: var(--muted); margin-top: 4px; line-height: 1.4; }

  #search {
    margin: 8px 16px; padding: 9px 12px; border-radius: 8px;
    border: 1px solid rgba(20,40,60,0.15); background: #fff; color: var(--dark);
    font-size: 13px; outline: none;
  }
  #search:focus { border-color: var(--accent); }

  #filters { display: flex; flex-wrap: wrap; gap: 5px; padding: 0 16px 8px; }
  .chip {
    font-size: 11px; padding: 4px 9px; border-radius: 999px; cursor: pointer;
    border: 1px solid rgba(20,40,60,0.2); background: transparent; color: var(--muted);
    user-select: none; transition: all 0.15s;
  }
  .chip.active { color: #fff; font-weight: 600; border-color: transparent; }

  #list { flex: 1; overflow-y: auto; padding: 4px 8px 8px; }
  .item { padding: 8px 10px; border-radius: 8px; cursor: pointer; display: flex; gap: 10px; align-items: center; }
  .item:hover { background: rgba(20,40,60,0.06); }
  .item .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .item .add {
    flex-shrink: 0; width: 24px; height: 24px; border-radius: 7px; cursor: pointer;
    border: 1px solid rgba(20,40,60,0.2); background: transparent; color: var(--muted);
    font-size: 14px; line-height: 1; display: none;
  }
  .item:hover .add { display: block; }
  .item .add:hover { border-color: var(--accent); color: var(--accent); }
  .item .add.in { display: block; border-color: transparent; color: #2e7d32; font-weight: 700; }
  .item .name { font-size: 13px; }
  .item .cat { font-size: 10.5px; color: var(--muted); }

  #trip { border-top: 1px solid rgba(20,40,60,0.1); padding: 10px 16px 14px; max-height: 34%; overflow-y: auto; }
  #trip h2 { font-size: 13px; color: var(--accent); margin-bottom: 6px; }
  #trip .empty { font-size: 11.5px; color: var(--muted); }
  .trip-item { display: flex; align-items: center; gap: 8px; font-size: 12.5px; padding: 4px 0; }
  .trip-item .n { flex: 1; cursor: pointer; }
  .trip-item .n:hover { color: var(--accent); }
  .trip-item .x { cursor: pointer; color: var(--muted); padding: 0 4px; }
  .trip-item .x:hover { color: #e53935; }
  #trip .trip-btns { display: flex; gap: 8px; margin-top: 8px; }
  #trip button {
    flex: 1; background: var(--accent); border: none; border-radius: 7px; padding: 7px 0;
    font-size: 12px; font-weight: 700; cursor: pointer; color: #fff;
  }
  #trip button.ghost { background: transparent; border: 1px solid rgba(20,40,60,0.2); color: var(--muted); }

  #toggle {
    position: absolute; top: 12px; left: 332px; z-index: 11;
    background: var(--panel); color: var(--dark); border: 1px solid rgba(20,40,60,0.15);
    border-radius: 8px; padding: 8px 11px; cursor: pointer; font-size: 14px;
    transition: left 0.25s ease;
  }
  #toggle.shifted { left: 12px; }

  #controls { position: absolute; bottom: 58px; right: 12px; z-index: 10; display: flex; flex-direction: column; gap: 8px; }
  #controls button {
    background: var(--panel); color: var(--dark); border: 1px solid rgba(20,40,60,0.15);
    border-radius: 8px; padding: 8px 12px; cursor: pointer; font-size: 12px; font-weight: 600;
  }
  #controls button:hover { border-color: var(--accent); }

  #card {
    position: absolute; right: 12px; top: 12px; width: 290px; z-index: 12;
    background: var(--panel); border-radius: 14px; padding: 16px;
    box-shadow: 0 8px 30px rgba(20,40,60,0.3); display: none;
  }
  #card .c-title { font-weight: 800; font-size: 15px; padding-right: 18px; }
  #card .c-cat { font-size: 10.5px; text-transform: uppercase; letter-spacing: 1px; margin: 3px 0 7px; font-weight: 700; }
  #card .c-desc { font-size: 12.5px; color: #40505e; line-height: 1.5; }
  #card .c-fact {
    font-size: 11.5px; margin-top: 9px; padding: 8px 10px; background: rgba(255,138,61,0.1);
    border-left: 3px solid var(--accent); border-radius: 4px; line-height: 1.45; color: #533a22;
  }
  #card .c-add {
    margin-top: 10px; width: 100%; background: var(--accent); color: #fff; border: none;
    border-radius: 8px; padding: 8px 0; font-size: 12.5px; font-weight: 700; cursor: pointer;
  }
  #card .c-add:disabled { background: rgba(20,40,60,0.15); color: var(--muted); cursor: default; }
  #card .c-close { position: absolute; right: 10px; top: 8px; cursor: pointer; color: var(--muted); font-size: 16px; }

  #credit {
    position: absolute; right: 12px; bottom: 18px; z-index: 10;
    display: flex; align-items: center; gap: 6px;
    background: var(--panel); border: 1px solid rgba(20,40,60,0.12); border-radius: 999px;
    padding: 6px 13px; font-size: 11px; color: var(--muted);
    box-shadow: 0 2px 8px rgba(20,40,60,0.15);
  }
  #credit a { display: flex; align-items: center; gap: 5px; color: var(--muted); text-decoration: none; transition: color 0.15s; }
  #credit a:hover { color: var(--accent); }
  #credit a:hover strong { color: var(--accent); }
  #credit strong { color: var(--dark); font-weight: 700; }
  #credit .sep { color: rgba(20,40,60,0.25); }
  #tripbar {
    position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%);
    z-index: 13; display: none; align-items: center; gap: 10px;
    background: rgba(18, 26, 34, 0.92); color: #f2ede4; border-radius: 12px;
    padding: 10px 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); backdrop-filter: blur(8px);
  }
  #tripbar.on { display: flex; }
  #tripbar .t-label { font-size: 13px; font-weight: 700; margin-right: 4px; }
  #tripbar .s-btn {
    background: rgba(255,255,255,0.08); color: #f2ede4; border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px; padding: 6px 12px; font-size: 12.5px; cursor: pointer; font-weight: 600;
  }
  #tripbar .t-next { background: #ff8a3d; color: #14100b; border-color: transparent; }
  #tripbar .s-btn:hover { border-color: #ff8a3d; }
  #story {
    position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px);
    width: min(620px, 92vw); z-index: 14; display: none; opacity: 0;
    background: rgba(18, 26, 34, 0.92); color: #f2ede4; border-radius: 16px;
    padding: 20px 24px 14px; box-shadow: 0 12px 40px rgba(0,0,0,0.45);
    backdrop-filter: blur(8px); transition: opacity 0.5s, transform 0.5s;
  }
  #story.on { display: block; }
  #story.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #story .s-chapter { font-size: 10.5px; letter-spacing: 2.5px; color: #ff8a3d; font-weight: 700; text-transform: uppercase; }
  #story .s-title { font-size: 21px; font-weight: 800; margin: 4px 0 8px; }
  #story .s-text { font-size: 13.5px; line-height: 1.65; color: #cfd6d3; }
  #story .s-nav { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
  #story .s-btn {
    background: rgba(255,255,255,0.08); color: #f2ede4; border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px; padding: 7px 14px; font-size: 12.5px; cursor: pointer; font-weight: 600;
  }
  #story .s-btn:hover { border-color: #ff8a3d; }
  #story .s-next { background: #ff8a3d; color: #14100b; border-color: transparent; }
  #story .s-exit { margin-left: auto; padding: 7px 10px; color: #98a2ab; }
  #story .s-dots { display: flex; gap: 5px; flex: 1; justify-content: center; }
  #story .s-dots span { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.22); cursor: pointer; }
  #story .s-dots span.on { background: #ff8a3d; }

  @media (max-width: 640px) { #sidebar { width: 260px; } #toggle { left: 272px; } }
</style>

</head>
<body>
<canvas id="scene"></canvas>
<div id="labels"></div>

<div id="sidebar">
  <header>
    <h1>Mangalore <span>Atlas</span></h1>
    <div class="sub">A hand-built 3D world of Kudla. Drag to orbit, scroll to zoom, right-drag to pan. Click any label to explore.</div>
  </header>
  <input id="search" type="text" placeholder="Search landmarks…" />
  <div id="filters"></div>
  <div id="list"></div>
  <div id="trip">
    <h2>🧳 My Trip <span id="tripCount"></span></h2>
    <div id="tripList"><div class="empty">Click "Add to trip" on any landmark to plan your Mangalore itinerary.</div></div>
    <div class="trip-btns" id="tripBtns" style="display:none">
      <button id="btnTripTour">▶ Tour my trip</button>
      <button id="btnTripClear" class="ghost">Clear</button>
    </div>
  </div>
</div>
<button id="toggle" title="Toggle sidebar">☰</button>

<div id="controls">
  <button id="btnStory" style="border-color:#ff8a3d;font-weight:700">📖 Story Mode</button>
  <button id="btnTour">✈ Fly Tour</button>
  <button id="btnHome">⌂ Reset View</button>
  <button id="btnMaplibre" onclick="window.open('v2-maplibre.html','_blank')" style="border-color:#4264fb">🗺 MapLibre</button>
</div>

<div id="credit">
  <a href="https://github.com/dev-shetty/mangalore-atlas" target="_blank" rel="noopener" title="View the repo">
    <svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
    mangalore-atlas
  </a>
  <span class="sep">·</span>
  <a href="https://github.com/dev-shetty" target="_blank" rel="noopener">Created by&nbsp;<strong>Deveesh Shetty</strong></a>
</div>

<div id="tripbar">
  <span class="t-label"></span>
  <button class="s-btn t-prev">◀</button>
  <button class="s-btn t-next">Next ▶</button>
  <button class="s-btn t-end">✕ End</button>
</div>

<div id="story">
  <div class="s-chapter"></div>
  <div class="s-title"></div>
  <div class="s-text"></div>
  <div class="s-nav">
    <button class="s-btn s-prev">◀ Back</button>
    <div class="s-dots"></div>
    <button class="s-btn s-next">Next ▶</button>
    <button class="s-btn s-exit" title="Exit story">✕</button>
  </div>
</div>

<div id="card">
  <span class="c-close" onclick="closeCard()">✕</span>
  <div class="c-title"></div>
  <div class="c-cat"></div>
  <div class="c-desc"></div>
  <div class="c-fact"></div>
  <button class="c-add"></button>
</div>

<script>
/* ============================ DATA ============================ */
const CATEGORIES = {
  temple:   { label: "Temples & Worship", color: "#ff7043", icon: "🛕" },
  beach:    { label: "Beaches",           color: "#29b6f6", icon: "🏖️" },
  company:  { label: "Companies & Industry", color: "#ab47bc", icon: "🏢" },
  mall:     { label: "Malls & Shopping",  color: "#f6b93b", icon: "🛍️" },
  education:{ label: "Education",         color: "#66bb6a", icon: "🎓" },
  food:     { label: "Food & Fun",        color: "#26c6da", icon: "🍨" },
  hotel:    { label: "Hotels & Stays",    color: "#8d6e63", icon: "🏨" },
  hospital: { label: "Hospitals",         color: "#ef5350", icon: "🏥" },
  landmark: { label: "Other Landmarks",   color: "#ec407a", icon: "📍" },
};

const LANDMARKS = [
  { name: "Kudroli Gokarnanatha Temple", cat: "temple", model: "gopuram", lng: 74.833, lat: 12.8763, alt: 12,
    desc: "Grand white-and-gold Gokarnanatheshwara temple built by Narayana Guru — centre of Mangaluru Dasara.",
    fact: "During Dasara the temple hosts one of Karnataka's biggest processions, with tiger-dance (Pili Vesha) troupes." },
  { name: "Kadri Manjunath Temple", cat: "temple", model: "kadri", lng: 74.8556, lat: 12.8859, alt: 45, pad: 420,
    desc: "Ancient temple (c. 1068 AD) with tiered Tulu-style copper roofs, bronze Lokeshwara, nine ponds and Pandava caves on the hill.",
    fact: "Its bronze Lokeshwara is considered one of the finest bronzes in India; the ponds are fed by a natural spring." },
  { name: "Mangaladevi Temple", cat: "temple", model: "mangaladevi", lng: 74.845, lat: 12.851, alt: 10, pad: 340,
    desc: "9th-century temple of goddess Mangaladevi — she gives Mangaluru its name.",
    fact: "The city is literally named after this temple: Mangala-uru, 'town of Mangaladevi'." },
  { name: "Sharavu Mahaganapathi Temple", cat: "temple", model: "temple", lng: 74.8415, lat: 12.8686, alt: 12,

  { name: "St. Aloysius Chapel", cat: "temple", model: "church", lng: 74.8454, lat: 12.8738, alt: 58,
    desc: "19th-century chapel covered wall-to-ceiling in paintings by Italian artist Antonio Moscheni.",
    fact: "Often called the 'Sistine Chapel of India' — every inch of the interior is painted." },
  { name: "Milagres Church", cat: "temple", model: "church", lng: 74.8449, lat: 12.8674, alt: 12,
    desc: "Historic Roman Catholic church founded in 1680.",
    fact: "Its façade lights up beautifully at Christmas." },
  { name: "Rosario Cathedral", cat: "temple", model: "cathedral", lng: 74.8363, lat: 12.856, alt: 15,
    desc: "Cathedral of Our Lady of the Rosary — oldest diocese church in Mangalore, dating to 1568.",
    fact: "Its dome is modelled on St. Peter's Basilica in Rome." },
  { name: "Zeenath Baksh Jumma Masjid", cat: "temple", model: "mosque", lng: 74.8354, lat: 12.8622, alt: 8,

  { name: "Kateel Durgaparameshwari Temple", cat: "temple", model: "kateel", lng: 74.8855, lat: 13.003, alt: 5, pad: 160,

  { name: "Sadashiva Temple, Surathkal", cat: "temple", model: "temple", lng: 74.7925, lat: 13.0060, alt: 12,

  { name: "Uchila Mahalakshmi Temple", cat: "temple", model: "temple", lng: 74.7965, lat: 13.0450, alt: 10,

  { name: "Bappanadu Durgaparameshwari, Mulki", cat: "temple", model: "temple", lng: 74.8000, lat: 13.0860, alt: 6,

  { name: "Kapu Mariamma Temple", cat: "temple", model: "temple", lng: 74.7560, lat: 13.2225, alt: 10,
    desc: "Historic Mariamma temple in Kaup town, a short walk from the famous beach.",

  { name: "Kapu Beach & Lighthouse", cat: "beach", model: "lighthouse", lng: 74.7515, lat: 13.2160, alt: 5,
    desc: "Kaup's iconic 1901 lighthouse standing on sea rocks over a gorgeous beach.",

  { name: "Someshwara Temple, Ullal", cat: "temple", model: "temple", lng: 74.8385, lat: 12.7862, alt: 8,

  { name: "Panambur Beach", cat: "beach", model: "beach_kite", lng: 74.8062, lat: 12.937, alt: 2,

  { name: "Tannirbhavi Beach", cat: "beach", model: "beach", lng: 74.81, lat: 12.885, alt: 2,

  { name: "MRPL Refinery", cat: "company", model: "refinery", lng: 74.865, lat: 12.958, alt: 60, pad: 400, mScale: 1.3,

  { name: "New Mangalore Port (NMPT)", cat: "company", model: "port", lng: 74.815, lat: 12.9285, alt: 4, pad: 400, mScale: 1.35,

  { name: "MCF Fertilizer Plant", cat: "company", model: "silos", lng: 74.822, lat: 12.921, alt: 8,

  { name: "Infosys / Diya, Kulai", cat: "company", model: "office", lng: 74.804, lat: 12.966, alt: 8,

/* ==================== GEOGRAPHY (stylized Mangalore) ==================== */
const C_LNG = 74.8420, C_LAT = 12.8700;
const MPD_X = 108500, MPD_Z = 110574; // metres per degree
const ll = (lng, lat) => ({ x: (lng - C_LNG) * MPD_X, z: -(lat - C_LAT) * MPD_Z });

LANDMARKS.forEach((l) => { const p = ll(l.lng, l.lat); l.x = p.x; l.z = p.z; });

// deterministic value noise
function hash2(ix, iz) { const n = Math.sin(ix * 127.1 + iz * 311.7) * 43758.5453; return n - Math.floor(n); }
function vnoise(x, z) {
  const ix = Math.floor(x), iz = Math.floor(z), fx = x - ix, fz = z - iz;
  const sx = fx * fx * (3 - 2 * fx), sz = fz * fz * (3 - 2 * fz);
  const a = hash2(ix, iz), b = hash2(ix + 1, iz), c = hash2(ix, iz + 1), d = hash2(ix + 1, iz + 1);
  return a + (b - a) * sx + (c - a) * sz + (a - b - c + d) * sx * sz;
}
function fbm(x, z) {
  let v = 0, amp = 0.5, f = 1;
  for (let i = 0; i < 4; i++) { v += amp * vnoise(x * f, z * f); amp *= 0.5; f *= 2.1; }
  return v;
}

// coastline: x position of shore as function of z (north = negative z)
// includes the Bengre sand spit (12.895 → 12.845) with the estuary opening at its tip
const COAST_PTS = [
  [13.300, 74.740], [13.240, 74.745], [13.190, 74.755], [13.140, 74.770], [13.100, 74.790],
  [13.069, 74.797], [13.038, 74.792], [13.005, 74.790], [12.975, 74.798],
  [12.955, 74.804], [12.937, 74.805], [12.918, 74.808], [12.903, 74.809], [12.885, 74.810],
  [12.868, 74.813], [12.853, 74.818], [12.846, 74.822], [12.843, 74.828], [12.815, 74.833],
  [12.780, 74.838], [12.740, 74.841],
].map(([lat, lng]) => ({ z: ll(lng, lat).z, x: ll(lng, lat).x }));
function coastX(z) {
  const p = COAST_PTS;
  if (z <= p[0].z) return p[0].x;
  for (let i = 0; i < p.length - 1; i++) {
    if (z >= p[i].z && z <= p[i + 1].z) {
      const t = (z - p[i].z) / (p[i + 1].z - p[i].z);
      return p[i].x + t * (p[i + 1].x - p[i].x);
    }
  }
  return p[p.length - 1].x;
}

// rivers as polylines [lng,lat] — REAL courses:
// Gurupura flows in from the east, turns SOUTH at Kulur and runs behind the
// Bengre spit past Sultan Battery & the Old Port to the shared estuary (~12.845).
// Netravati comes from the south-east past Adyar/Jeppinamogaru and bends NW to the same mouth.
const RIVERS = [
  { w: 320, pts: [[74.935, 12.934], [74.905, 12.9265], [74.875, 12.9215], [74.848, 12.9145], [74.830, 12.908],
                  [74.820, 12.903], [74.8165, 12.895], [74.8185, 12.884], [74.822, 12.872], [74.826, 12.858], [74.828, 12.847]] }, // Gurupura/Phalguni
  { w: 360, pts: [[74.945, 12.866], [74.912, 12.863], [74.893, 12.858], [74.876, 12.854], [74.862, 12.851],
                  [74.851, 12.846], [74.844, 12.841], [74.836, 12.842], [74.828, 12.847]] },                                        // Netravati
  { w: 500, pts: [[74.828, 12.847], [74.816, 12.8445]] },                                                                           // estuary mouth to the sea
  { w: 260, pts: [[74.950, 13.000], [74.912, 13.0035], [74.8855, 13.0030], [74.860, 13.0065], [74.828, 13.037], [74.798, 13.068]] },  // Nandini — flows around the Kateel islet
  { w: 240, pts: [[74.870, 13.104], [74.835, 13.098], [74.810, 13.094], [74.796, 13.087], [74.789, 13.073]] },                        // Shambhavi at Mulki
];
RIVERS.forEach((r) => { r.xz = r.pts.map(([lng, lat]) => ll(lng, lat)); });

function distSeg(px, pz, ax, az, bx, bz) {
  const dx = bx - ax, dz = bz - az;
  const t = Math.max(0, Math.min(1, ((px - ax) * dx + (pz - az) * dz) / (dx * dx + dz * dz)));
  const gx = ax + t * dx - px, gz = az + t * dz - pz;
  return Math.sqrt(gx * gx + gz * gz);
}
function riverDist(x, z) {
  let best = 1e9;
  for (const r of RIVERS) {
    for (let i = 0; i < r.xz.length - 1; i++) {
      const d = distSeg(x, z, r.xz[i].x, r.xz[i].z, r.xz[i + 1].x, r.xz[i + 1].z) - (r.w - 260);
      if (d < best) best = d;
    }
  }
  return best;
}

const HILLS = [
  { lng: 74.8570, lat: 12.8870, r: 950, h: 45 },   // Kadri hill (temple on its west slope)
  { lng: 74.8425, lat: 12.8722, r: 560, h: 42 },   // Lighthouse hill (chapel, college, garden)
  { lng: 74.9261, lat: 12.8166, r: 1700, h: 80 },  // Konaje
  { lng: 74.8987, lat: 12.9193, r: 1300, h: 45 },  // Pilikula ridge
  { lng: 74.8890, lat: 12.9610, r: 1150, h: 85 },  // Bajpe tabletop (hilltop airport)
  { lng: 74.8580, lat: 12.8650, r: 900, h: 32 },   // Nanthoor–Pumpwell ridge
  { lng: 74.8982, lat: 12.8090, r: 1200, h: 50 },  // Deralakatte plateau
  { lng: 74.8650, lat: 12.9580, r: 1000, h: 30 },  // Katipalla rise (MRPL)
].map((h) => ({ ...h, ...ll(h.lng, h.lat) }));
const KATEEL = ll(74.8855, 13.0030);

function baseHeight(x, z) {
  const d = x - coastX(z); // metres inland
  if (d < 0) return -7 - Math.min(22, -d * 0.011); // sea floor drops fast: crisp dark coast
  let h;
  if (d < 260) h = 1.2 + d * 0.004; // beach sand
  else {
    const inland = Math.min(1, (d - 260) / 9000);
    h = 2.5 + inland * 26 + fbm(x * 0.00035, z * 0.00035) * inland * 55;
  }
  for (const hill of HILLS) {
    const dh = Math.hypot(x - hill.x, z - hill.z);
    if (dh < hill.r) {
      const t = Math.cos((dh / hill.r) * Math.PI) * 0.5 + 0.5;
      h += hill.h * t * t;
    }
  }
  // carve rivers
  const rd = riverDist(x, z);
  if (rd < 260) {
    const t = Math.max(0, rd / 260);
    const bank = t * t;
    h = h * bank + (-5) * (1 - bank);
  }
  // Kateel islet in the river
  const dk = Math.hypot(x - KATEEL.x, z - KATEEL.z);
  if (dk < 150) h = Math.max(h, 3.2 * (1 - dk / 150) + 1.5);
  return h;
}

// Illustrated relief: preserve beaches, smoothly exaggerate inland elevation up to 4×.
const relief = h => h <= 3 ? h : h * (1 + 3 * THREE.MathUtils.smoothstep(h, 3, 30));
function rawHeight(x, z) { return relief(baseHeight(x, z)); }
// each landmark sits at its illustrated elevation (alt, metres ASL); the terrain blends
// up/down to meet it across a flatten pad — so hilltop places are genuinely on hills.
LANDMARKS.forEach((l) => {
  l.y = l.alt !== undefined ? relief(l.alt) : Math.max(rawHeight(l.x, l.z), l.cat === "beach" ? 1.4 : 1.0);
  l.padR = l.pad || 240;
});
function heightAt(x, z) {
  let h = rawHeight(x, z);
  for (const l of LANDMARKS) {
    const d = Math.hypot(x - l.x, z - l.z);
    if (d < l.padR) {
      const t = 1 - Math.max(0, d - l.padR * .6) / (l.padR * .4);
      const w = t * t * (3 - 2 * t);
      h = h * (1 - w) + l.y * w;
    }
  }
  return h;
}

/* ============================ SCENE ============================ */
const canvas = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);

renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.88;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb9d4dc);
scene.fog = new THREE.Fog(0xb9d4dc, 16000, 58000);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 10, 120000);
const HOME_POS = new THREE.Vector3(-5200, 3600, 5400);
const HOME_TGT = new THREE.Vector3(900, 100, -3200);
camera.position.copy(HOME_POS);

// debug/deep-link: ?cam=px,py,pz,tx,ty,tz positions the camera
{
  const q = new URLSearchParams(location.search).get("cam");
  if (q && q.split(",").length === 6 && q.split(",").every(v => v.trim() !== "" && Number.isFinite(Number(v)) && Math.abs(Number(v)) < 120000)) {
    const [px, py, pz, tx, ty, tz] = q.split(",").map(Number);
    camera.position.set(px, py, pz);
    HOME_TGT.set(tx, ty, tz);
  }
}
const controls = new THREE.OrbitControls(camera, canvas);
controls.target.copy(HOME_TGT);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = 1.38;
controls.screenSpacePanning = false;
controls.touches.ONE = THREE.TOUCH.ROTATE;
controls.touches.TWO = THREE.TOUCH.DOLLY_PAN;
canvas.style.touchAction = 'none';
controls.minDistance = 250;
controls.maxDistance = 52000;

const skyLight = new THREE.HemisphereLight(0xd9ecff, 0x82735e, 0.48);
scene.add(skyLight);
const sun = new THREE.DirectionalLight(0xfff3da, 1.18);
const sunOffset = new THREE.Vector3(-7000, 9000, -5000);
sun.position.copy(sunOffset);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.00015;
sun.shadow.normalBias = 2;
sun.shadow.camera.near = 100;
sun.shadow.camera.far = 35000;
scene.add(sun, sun.target);
function updateSun() {
  const span = Math.min(15000, Math.max(1500, camera.position.distanceTo(controls.target) * 0.65));
  const sc = sun.shadow.camera;
  sc.left = sc.bottom = -span; sc.right = sc.top = span;
  sc.updateProjectionMatrix();
  sun.target.position.copy(controls.target);
  sun.position.copy(controls.target).add(sunOffset);
}

/* ---- terrain ---- */
const TX0 = -11000, TX1 = 14000, TZ0 = -40500, TZ1 = 11500;
const SEGX = 320, SEGZ = 640;
const terrainGeo = new THREE.PlaneGeometry(TX1 - TX0, TZ1 - TZ0, SEGX, SEGZ);
terrainGeo.rotateX(-Math.PI / 2);
{
  const pos = terrainGeo.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  const cDeep = new THREE.Color(0x0d3f6d), cShallow = new THREE.Color(0x3f89ad),
    cSand = new THREE.Color(0xefd493), cPlain = new THREE.Color(0xe4d6ab),
    cGreen1 = new THREE.Color(0x93b65c), cGreen2 = new THREE.Color(0x6a9450), tmp = new THREE.Color();
  const BEACH_XZ = LANDMARKS.filter((l) => l.cat === "beach").map((l) => [l.x, l.z]);
  const nearBeach = (x, z) => BEACH_XZ.some(([bx, bz]) => (x - bx) * (x - bx) + (z - bz) * (z - bz) < 550 * 550);
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i) + (TX0 + TX1) / 2, z = pos.getZ(i) + (TZ0 + TZ1) / 2;
    const h = heightAt(x, z);
    const colorHeight = baseHeight(x, z);
    pos.setY(i, h);
    pos.setX(i, x); pos.setZ(i, z);
    if (h < 0) tmp.copy(cDeep).lerp(cShallow, Math.min(1, (h + 16) / 16));
    else if (h < 2.4 || (h < 5.5 && nearBeach(x, z))) tmp.copy(cSand);   // wide sandy aprons at beaches
    else if (colorHeight < 22) {
      tmp.copy(cPlain).lerp(cGreen1, Math.max(0, Math.min(1, fbm(x * 0.0011, z * 0.0011) - 0.40) * 2.4));
    } else if (colorHeight < 48) tmp.copy(cGreen1);
    else tmp.copy(cGreen2);
    colors[i * 3] = tmp.r; colors[i * 3 + 1] = tmp.g; colors[i * 3 + 2] = tmp.b;
  }
  terrainGeo.setAttribute("color", new THREE.BufferAttribute(colors, 3));
  terrainGeo.computeVertexNormals();
  // slope shading: darken steep faces so hills, valleys and the Bajpe tabletop read in relief
  const nrm = terrainGeo.attributes.normal;
  for (let i = 0; i < pos.count; i++) {
    if (pos.getY(i) < 0.5) continue;
    const ny = Math.max(0, nrm.getY(i));
    const shade = 0.52 + 0.48 * ny * ny;
    colors[i * 3] *= shade; colors[i * 3 + 1] *= shade; colors[i * 3 + 2] *= shade;
  }
  terrainGeo.attributes.color.needsUpdate = true;
}
// Sample the actual mesh triangles, so all later geometry shares the rendered ground.
const analyticHeight = heightAt;
heightAt = function(x, z) {
  const gx = (x - TX0) / (TX1 - TX0) * SEGX, gz = (z - TZ0) / (TZ1 - TZ0) * SEGZ;
  if (gx < 0 || gz < 0 || gx >= SEGX || gz >= SEGZ) return analyticHeight(x, z);
  const ix = Math.floor(gx), iz = Math.floor(gz), u = gx - ix, v = gz - iz;
  const pos = terrainGeo.attributes.position, a = iz * (SEGX + 1) + ix;
  const h00 = pos.getY(a), h10 = pos.getY(a + 1), h01 = pos.getY(a + SEGX + 1), h11 = pos.getY(a + SEGX + 2);
  return u + v <= 1 ? h00 + u * (h10 - h00) + v * (h01 - h00)
    : h11 + (1 - u) * (h01 - h11) + (1 - v) * (h10 - h11);
};

/* ---- roads ---- */
function makeRoad(lls, width = 70, color = 0x7d8590) {
  const pts = lls.map(([lng, lat]) => ll(lng, lat));
  for (let i = 1; i < pts.length; i++) ROAD_SEGMENTS.push({ a: pts[i-1], b: pts[i], width });
  // resample
  const path = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    const n = Math.max(2, Math.ceil(Math.hypot(b.x - a.x, b.z - a.z) / 35));
    for (let j = 0; j < n; j++) path.push({ x: a.x + ((b.x - a.x) * j) / n, z: a.z + ((b.z - a.z) * j) / n });
  }
  path.push(pts[pts.length - 1]);
  const verts = [], idx = [];
  for (let i = 0; i < path.length; i++) {
    const p = path[i], q = path[Math.min(i + 1, path.length - 1)], o = path[Math.max(i - 1, 0)];
    let dx = q.x - o.x, dz = q.z - o.z;
    const len = Math.hypot(dx, dz) || 1;
    const nx = -dz / len, nz = dx / len;
    for (const sign of [1, -1]) {
      const x = p.x + sign * nx * width / 2, z = p.z + sign * nz * width / 2;
      verts.push(x, Math.max(heightAt(x, z), 1.0) + 2, z);
    }
    if (i < path.length - 1) {
      const k = i * 2;
      idx.push(k, k + 1, k + 2, k + 1, k + 3, k + 2);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(verts), 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  const mesh = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ color }));
  mesh.receiveShadow = true;
  scene.add(mesh);
}

// bridges (deck + pillars) at the two big NH-66 river crossings
function makeBridge(lngA, latA, lngB, latB, width = 90) {
  const a = ll(lngA, latA), b = ll(lngB, latB);
  const len = Math.hypot(b.x - a.x, b.z - a.z);
  const deckY = Math.max(14,heightAt(a.x,a.z)+8,heightAt(b.x,b.z)+8);
  BRIDGE_SPANS.push({a,b,width,deckY});
  const g = new THREE.Group();
  const deck = new THREE.Mesh(new THREE.BoxGeometry(len, 8, width), new THREE.MeshLambertMaterial({ color: 0x7d848c }));
  deck.position.y = deckY;
  g.add(deck);
  const rail = new THREE.Mesh(new THREE.BoxGeometry(len, 4, 6), new THREE.MeshLambertMaterial({ color: 0xb8bec5 }));
  rail.position.set(0, deckY+6, width / 2 - 3); g.add(rail);
  const rail2 = rail.clone(); rail2.position.z = -width / 2 + 3; g.add(rail2);
  const nP = Math.max(2, Math.round(len / 220));
  for (let i = 0; i <= nP; i++) {
    const p = new THREE.Mesh(new THREE.BoxGeometry(16, deckY+12, width * 0.7), new THREE.MeshLambertMaterial({ color: 0x9aa0a8 }));
    p.position.set(-len / 2 + (len * i) / nP, (deckY-12)/2, 0);
    g.add(p);
  }
  g.position.set((a.x + b.x) / 2, 0, (a.z + b.z) / 2);
  g.rotation.y = -Math.atan2(b.z - a.z, b.x - a.x);
  scene.add(g);
}

{

/* ---- trees ---- */
{
  const spots = [];
  let seed = 7;
  const rnd = () => (seed = (seed * 48271) % 2147483647) / 2147483647;
  let tries = 0;
  while (spots.length < 3600 && tries < 30000) {
    tries++;
    const x = TX0 + rnd() * (TX1 - TX0), z = TZ0 + rnd() * (TZ1 - TZ0);
    const h = heightAt(x, z);
    if (h < 2.5 || districtWorld.occupied(x, z, 28)) continue;
    if (riverDist(x, z) < 120) continue;
    const green = h > 20 || fbm(x * 0.0011, z * 0.0011) > 0.5;
    if (!green) continue;
    spots.push({ x, z, y: h, s: 0.7 + rnd() * 0.9, g: rnd() });
  }
  const inst = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(25, 0), new THREE.MeshLambertMaterial(), spots.length);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), s3 = new THREE.Vector3(), p3 = new THREE.Vector3();
  const gcols = [new THREE.Color(0x2f6d33), new THREE.Color(0x448840), new THREE.Color(0x255a2a)];
  spots.forEach((p, i) => {
    s3.set(p.s, p.s * 1.25, p.s);
    p3.set(p.x, p.y + 23 * p.s, p.z);
    m4.compose(p3, q, s3);
    inst.setMatrixAt(i, m4);
    inst.setColorAt(i, gcols[(p.g * 3) | 0]);
  });
  scene.add(inst);
}

const materialCache = new Map();
const M = c => { if (!materialCache.has(c)) materialCache.set(c, new THREE.MeshLambertMaterial({ color: c })); return materialCache.get(c); };
function box(w, h, d, c, x = 0, y = 0, z = 0) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), M(c)); m.position.set(x, y + h / 2, z); return m; }
function cyl(rt, rb, h, c, x = 0, y = 0, z = 0, seg = 12) { const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), M(c)); m.position.set(x, y + h / 2, z); return m; }
function cone(r, h, c, x = 0, y = 0, z = 0, seg = 12, rotY = 0) { const m = new THREE.Mesh(new THREE.ConeGeometry(r, h, seg), M(c)); m.position.set(x, y + h / 2, z); m.rotation.y = rotY; return m; }
function sph(r, c, x = 0, y = 0, z = 0) { const m = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 9), M(c)); m.position.set(x, y, z); return m; }
function dome(r, c, x = 0, y = 0, z = 0) { const m = new THREE.Mesh(new THREE.SphereGeometry(r, 14, 9, 0, Math.PI * 2, 0, Math.PI / 2), M(c)); m.position.set(x, y, z); return m; }
function palm(x, z, h = 9) {
  const g = new THREE.Group();
  const t = cyl(0.35, 0.55, h, 0x8d6e63, 0, 0, 0, 6); t.rotation.z = 0.12; g.add(t);
  for (let i = 0; i < 6; i++) {
    const leaf = box(5.5, 0.2, 1.3, 0x2e7d32);
    leaf.position.set(Math.cos((i / 6) * Math.PI * 2) * 2.4 + h * 0.12, h + 0.4, Math.sin((i / 6) * Math.PI * 2) * 2.4);
    leaf.rotation.y = -(i / 6) * Math.PI * 2; leaf.rotation.z = 0.35;
    g.add(leaf);
  }
  g.position.set(x, 0, z);
  return g;
}
function treeM(x, z, s = 1) { const g = new THREE.Group(); g.add(cyl(0.5 * s, 0.7 * s, 4 * s, 0x795548, 0, 0, 0, 6)); g.add(sph(3.2 * s, 0x388e3c, 0, 5.5 * s, 0)); g.position.set(x, 0, z); return g; }
function kalasha(x, y, z, s = 1) { const g = new THREE.Group(); g.add(cyl(0.35 * s, 0.5 * s, 1.6 * s, 0xffd54f, x, y, z, 8)); g.add(sph(0.55 * s, 0xffd54f, x, y + 2 * s, z)); return g; }

function buildPath(ptsLL) {
  const path = [];
  const pts = ptsLL.map(([lng, lat]) => ll(lng, lat));
  let acc = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    const segLen = Math.hypot(b.x - a.x, b.z - a.z);
    const n = Math.max(2, Math.ceil(segLen / 220));
    for (let j = 0; j < n; j++) {
      const x = a.x + ((b.x - a.x) * j) / n, z = a.z + ((b.z - a.z) * j) / n;
      path.push({ x, z, y: travelHeight(x, z) + 2.6, d: acc });
      acc += segLen / n;
    }
  }
  path.total = acc;
  return path;
}

function placeOnPath(path, frac, lane) {
  const d = frac * path.total;
  let lo = 0, hi = path.length - 1;
  while (lo < hi - 1) { const m = (lo + hi) >> 1; path[m].d <= d ? (lo = m) : (hi = m); }
  const a = path[lo], b = path[Math.min(lo + 1, path.length - 1)];
  const t = Math.min(1, (d - a.d) / Math.max(1, (b.d - a.d)));
  const dx = b.x - a.x, dz = b.z - a.z, len = Math.hypot(dx, dz) || 1;
  return {
    x: a.x + dx * t - (dz / len) * lane, z: a.z + dz * t + (dx / len) * lane,
    y: a.y + (b.y - a.y) * t, rot: Math.atan2(dx, dz),
  };
}

const v3 = new THREE.Vector3();
function updateLabels() {
  const camD = camera.position.distanceTo(controls.target);
  AREAS.forEach((a, i) => {
    const d = areaDivs[i];
    if (camD > 30000) { d.style.display = "none"; return; }
    v3.set(a.x, a.y, a.z).project(camera);
    if (v3.z > 1 || Math.abs(v3.x) > 1.05 || Math.abs(v3.y) > 1.05) { d.style.display = "none"; return; }
    d.style.display = "block";
    d.style.left = ((v3.x + 1) / 2) * innerWidth + "px";
    d.style.top = ((-v3.y + 1) / 2) * innerHeight + "px";
    d.style.opacity = Math.min(1, Math.max(0.35, 1.4 - camD / 25000));
  });
  updatePills();
}
function updatePills() {
  const w = innerWidth, h = innerHeight;
  // project all visible labels, then greedily drop overlapping ones (closest first,
  // selected landmark always wins) so the screen never gets cramped
  const cand = [];
  LANDMARKS.forEach((l, i) => {
    if (!visibleSet.has(i)) { labelDivs[i].style.display = "none"; return; }
    v3.set(l.x, l.y + 90, l.z).project(camera);
    if (v3.z > 1 || v3.x < -1.1 || v3.x > 1.1 || v3.y < -1.1 || v3.y > 1.1) { labelDivs[i].style.display = "none"; return; }
    if (i !== selectedIdx && Math.hypot(l.x - controls.target.x, l.z - controls.target.z) > Math.max(1800, camera.position.distanceTo(controls.target) * 1.1)) { labelDivs[i].style.display = "none"; return; }
    cand.push({ i, sx: ((v3.x + 1) / 2) * w, sy: ((-v3.y + 1) / 2) * h, z: v3.z, pw: l.name.length * 6.6 + 34 });
  });
  cand.sort((a, b) => (a.i === selectedIdx ? -1 : b.i === selectedIdx ? 1 : a.z - b.z));
  const placed = [];
  const distance = camera.position.distanceTo(controls.target);
  const labelBudget = innerWidth < 700 ? 4 : distance < 3000 ? 5 : 9;
  for (const c of cand) {
    const x0 = c.sx - c.pw / 2, x1 = c.sx + c.pw / 2, y0 = c.sy - 36, y1 = c.sy;
    const clash = placed.some((p) => x0 < p.x1 + 4 && x1 > p.x0 - 4 && y0 < p.y1 + 4 && y1 > p.y0 - 4);
    const d = labelDivs[c.i];
    if (clash || placed.length >= labelBudget) { d.style.display = "none"; continue; }
    placed.push({ x0, x1, y0, y1 });
    d.style.display = "flex";
    d.style.left = c.sx + "px";
    d.style.top = c.sy + "px";
    d.style.zIndex = Math.round((1 - c.z) * 10000);
  }
}

/* ---- selection card ---- */
const focusRing = new THREE.Mesh(new THREE.RingGeometry(135, 150, 64), new THREE.MeshBasicMaterial({ color: 0xff9f43, transparent: true, opacity: 0.85, side: THREE.DoubleSide, depthWrite: false }));
focusRing.rotation.x = -Math.PI / 2;
focusRing.visible = false;
scene.add(focusRing);
const card = document.getElementById("card");
let selectedIdx = null;
function selectLandmark(i, fly) {
  selectedIdx = i;
  const l = LANDMARKS[i], c = CATEGORIES[l.cat];
  focusRing.position.set(l.x, l.y + 3, l.z);
  focusRing.visible = true;
  window.dispatchEvent(new CustomEvent('atlas:select', { detail: { id: i, name: l.name, lng: l.lng, lat: l.lat, category: l.cat } }));
  card.querySelector(".c-title").textContent = l.name;
  const cc = card.querySelector(".c-cat"); cc.textContent = c.label; cc.style.color = c.color;
  card.querySelector(".c-desc").textContent = l.desc;
  const cf = card.querySelector(".c-fact"); cf.innerHTML = "💡 " + l.fact; cf.style.display = l.fact ? "" : "none";
  updateCardBtn();
  card.style.display = "block";
  if (fly) flyToLandmark(i);
}
function updateCardBtn() {
  const btn = card.querySelector(".c-add");
  const inTrip = trip.includes(selectedIdx);
  btn.textContent = inTrip ? "✓ In your trip" : "＋ Add to trip";
  btn.disabled = inTrip;
  btn.onclick = () => { if (!trip.includes(selectedIdx)) { trip.push(selectedIdx); renderTrip(); updateCardBtn(); } };
}
window.closeCard = () => { card.style.display = "none"; selectedIdx = null; focusRing.visible = false; };

/* ---- camera fly ---- */
let flight = null;
function flyToLandmark(i) {
  const l = LANDMARKS[i];
  const tgt = new THREE.Vector3(l.x, l.y + 30, l.z);
  const dir = camera.position.clone().sub(controls.target).normalize();
  if (dir.y < 0.25) dir.y = 0.25;
  dir.normalize();
  const pos = tgt.clone().add(dir.multiplyScalar(1400)).add(new THREE.Vector3(0, 420, 0));
  flight = { t: 0, p0: camera.position.clone(), p1: pos, t0: controls.target.clone(), t1: tgt };
}
function flyHome() {
  flight = { t: 0, p0: camera.position.clone(), p1: HOME_POS.clone(), t0: controls.target.clone(), t1: HOME_TGT.clone() };
}
controls.addEventListener('start', () => { flight = null; stopTour(); stopTripTour(); controls.autoRotate = false; });

/* ---- raycast click on models ---- */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let downAt = null;
canvas.addEventListener("pointerdown", (e) => { downAt = [e.clientX, e.clientY]; });
canvas.addEventListener("pointerup", (e) => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(modelEntries.map((m) => m.group), true);
  if (hits.length && hits[0].object.userData.lmIdx !== undefined) selectLandmark(hits[0].object.userData.lmIdx, false);
});

/* ---- sidebar: filters, search, list ---- */
const trip = [];
const activeCats = new Set(Object.keys(CATEGORIES));
let searchTerm = "";
const visibleSet = new Set(LANDMARKS.map((_, i) => i));

const filtersEl = document.getElementById("filters");
Object.entries(CATEGORIES).forEach(([key, c]) => {
  const chip = document.createElement("button");
  chip.className = "chip active";
  chip.textContent = c.label;
  chip.style.background = c.color;
  chip.onclick = () => {
    if (activeCats.has(key)) { activeCats.delete(key); chip.classList.remove("active"); chip.style.background = "transparent"; }
    else { activeCats.add(key); chip.classList.add("active"); chip.style.background = c.color; }
    refresh();
  };
  filtersEl.appendChild(chip);
});

const listEl = document.getElementById("list");
function refresh() {
  listEl.innerHTML = "";
  visibleSet.clear();
  LANDMARKS.forEach((l, i) => {
    const vis = activeCats.has(l.cat) && l.name.toLowerCase().includes(searchTerm);
    const entry = modelEntries.find((m) => m.idx === i);
    if (entry) entry.group.visible = vis;
    if (!vis) return;
    visibleSet.add(i);
    const item = document.createElement("div");
    item.className = "item";
    const inTrip = trip.includes(i);
    item.innerHTML = `<span class="dot" style="background:${CATEGORIES[l.cat].color}"></span>
      <span style="flex:1"><div class="name">${l.name}</div><div class="cat">${CATEGORIES[l.cat].label}</div></span>
      <button class="add${inTrip ? " in" : ""}" title="Add to trip">${inTrip ? "✓" : "＋"}</button>`;
    item.onclick = () => selectLandmark(i, true);
    const addBtn = item.querySelector(".add");
    addBtn.onclick = (e) => {
      e.stopPropagation();
      if (!trip.includes(i)) { trip.push(i); renderTrip(); if (selectedIdx === i) updateCardBtn(); }
      addBtn.textContent = "✓";
      addBtn.classList.add("in");
    };
    listEl.appendChild(item);
  });
}
refresh();
document.getElementById("search").addEventListener("input", (e) => { searchTerm = e.target.value.toLowerCase(); refresh(); });

/* ---- trip planner ---- */
function renderTrip() {
  const listT = document.getElementById("tripList");
  const btns = document.getElementById("tripBtns");
  document.getElementById("tripCount").textContent = trip.length ? `(${trip.length})` : "";
  if (!trip.length) {
    listT.innerHTML = '<div class="empty">Click "Add to trip" on any landmark to plan your Mangalore itinerary.</div>';
    btns.style.display = "none";
    return;
  }
  btns.style.display = "flex";
  listT.innerHTML = "";
  trip.forEach((idx, order) => {
    const l = LANDMARKS[idx];
    const row = document.createElement("div");
    row.className = "trip-item";
    row.innerHTML = `<span style="width:8px;height:8px;border-radius:50%;background:${CATEGORIES[l.cat].color}"></span>
      <span class="n">${order + 1}. ${l.name}</span><span class="x">✕</span>`;
    row.querySelector(".n").onclick = () => selectLandmark(idx, true);
    row.querySelector(".x").onclick = () => { trip.splice(order, 1); renderTrip(); if (selectedIdx !== null) updateCardBtn(); };
    listT.appendChild(row);
  });
  refresh(); // keep the ＋/✓ buttons in the landmark list in sync
}
document.getElementById("btnTripClear").onclick = () => { trip.length = 0; renderTrip(); if (selectedIdx !== null) updateCardBtn(); };

// trip tour: manual, story-style — you press Next to move between your stops
let tripActive = false, tripPos = 0;
const tripTourBtn = document.getElementById("btnTripTour");
const tripBar = document.getElementById("tripbar");
function tripGo(i) {
  tripPos = Math.max(0, Math.min(trip.length - 1, i));
  selectLandmark(trip[tripPos], true);
  tripBar.querySelector(".t-label").textContent = `Stop ${tripPos + 1} of ${trip.length} · ${LANDMARKS[trip[tripPos]].name}`;
  tripBar.querySelector(".t-prev").style.visibility = tripPos ? "visible" : "hidden";
  tripBar.querySelector(".t-next").textContent = tripPos === trip.length - 1 ? "Finish ✓" : "Next ▶";
}
function stopTripTour() {
  if (!tripActive) return;
  tripActive = false;
  tripBar.classList.remove("on");
  tripTourBtn.textContent = "▶ Tour my trip";
}
tripTourBtn.onclick = () => {
  if (tripActive) return stopTripTour();
  if (!trip.length) return;
  tripActive = true;
  tripTourBtn.textContent = "■ End tour";
  tripBar.classList.add("on");
  tripGo(0);
};
tripBar.querySelector(".t-next").onclick = () => (tripPos >= trip.length - 1 ? stopTripTour() : tripGo(tripPos + 1));
tripBar.querySelector(".t-prev").onclick = () => tripGo(tripPos - 1);
tripBar.querySelector(".t-end").onclick = stopTripTour;
addEventListener("keydown", (e) => {
  if (!tripActive) return;
  if (e.key === "ArrowRight" || e.key === "Enter") tripBar.querySelector(".t-next").click();
  if (e.key === "ArrowLeft") tripBar.querySelector(".t-prev").click();
  if (e.key === "Escape") stopTripTour();
});
// headless test hook: ?triptest=1 loads a trip and starts the tour
if (new URLSearchParams(location.search).get("triptest")) {
  setTimeout(() => {
    trip.push(1, 12, 22);
    renderTrip();
    document.getElementById("btnTripTour").click();
  }, 600);
}

/* ---- fly tour ---- */
let tourActive = false, tourIdx = 0, tourTimer = null;
const tourBtn = document.getElementById("btnTour");
function stopTour() { if (!tourActive) return; tourActive = false; clearTimeout(tourTimer); tourBtn.textContent = "✈ Fly Tour"; }
function tourStep() {
  if (!tourActive) return;
  const vis = [...visibleSet];
  if (!vis.length) return stopTour();
  selectLandmark(vis[tourIdx % vis.length], true);
  tourIdx++;
  tourTimer = setTimeout(tourStep, 7000);
}
tourBtn.onclick = () => {
  if (tourActive) return stopTour();
  tourActive = true; tourBtn.textContent = "■ Stop Tour"; tourStep();
};
document.getElementById("btnHome").onclick = () => { stopTour(); flyHome(); };

/* ---- Story Mode: "A Day in Kudla" ---- */
const STORY = [
  { at: "Kadri Manjunath Temple", title: "Dawn on Kadri Hill", dist: 900,
    text: "The day begins before sunrise, with temple bells rolling down Kadri hill. Pilgrims dip in the nine spring-fed ponds while the copper roofs catch the first light — this temple has watched over Kudla for a thousand years." },
  { at: "New Taj Mahal Café", title: "Breakfast at a Century-Old Café", dist: 620,
    text: "Down in Kodialbail, the day's first goli baje hiss in the kadai at New Taj Mahal Café. Order a plate with a steel tumbler of filter coffee, and eat like Mangaloreans have since 1911." },
  { at: "Clock Tower, Hampankatta", title: "The City Wakes at the Clock Tower", dist: 750,
    text: "By nine, Hampankatta is a swirl of private buses in racing liveries, each conductor whistling a language only Kudla understands. Everything in Mangalore is measured from this roundabout — and everyone has said 'clock tower bali sigana' at least once." },
  { at: "Old Port / Bunder", title: "A Thousand Years of Salt & Trade", dist: 900,
    text: "At the old Bunder, fishing boats unload the morning catch where dhows from Persia and Arabia once docked. Squint past the ice crates and you can see a port that has been working, without pause, for a millennium." },
  { at: "Sultan Battery", title: "Tipu's Watchtower & the Ferry", dist: 850,
    text: "Upriver stands Sultan Battery, the black-stone watchtower Tipu Sultan built in 1784 to keep enemy warships out of the Gurupura. Catch the little ferry behind it — it's still the best few rupees you'll ever spend." },
  { at: "Tannirbhavi Beach", title: "Across to Tannirbhavi", dist: 1000,

  { at: "Kudroli Gokarnanatha Temple", title: "The White & Gold of Kudroli", dist: 900,
    text: "Back in town, Kudroli's white gopuram rises in tiers of gold. Built by Narayana Guru for communities the old temples turned away, it now hosts the city's grandest Dasara — tiger-dancers and all." },
  { at: "Giri Manjas", title: "A Fish Meal Like No Other", dist: 620,
    text: "Lunch is non-negotiable: a fish thali at Giri Manjas. Neer dosa soft as cloth, bangude ghee roast, anjal fry — in a room that hasn't changed in decades, because it never needed to." },
  { at: "New Mangalore Port (NMPT)", title: "Cranes on the Horizon", dist: 1600,
    text: "North along NH-66, the deep-water port at Panambur swings containers of coffee and cashew onto ships bound for the world — Karnataka's only major port, guarded by its long stone breakwaters." },
  { at: "Panambur Beach", title: "Kites & Jetskis at Panambur", dist: 1100,

    text: "Further north, NITK Surathkal spreads between highway and sea — the only elite tech campus in India whose students can walk from a lab to a lighthouse beach in five minutes." },
  { at: "Kateel Durgaparameshwari Temple", title: "The Temple in the River", dist: 900,

  { at: "Pabbas Ice Cream", title: "The Gadbad Hour", dist: 620,
    text: "Evening means Pabbas. Order the Gadbad — invented right here — and watch layers of ice cream, jelly and dry fruits arrive in a tall glass. 'Gadbad' means chaos. It is, gloriously." },
  { at: "Someshwara Beach, Ullal", title: "Sunset on the Rudra Rocks", dist: 1000,
    text: "End at Someshwara, where Rani Abbakka's temple watches waves shatter on the Rudra Shile. The sun drops into the Arabian Sea, the rocks turn gold, and Kudla's day folds shut. Naale kaanuva — see you tomorrow." },
];
const storyEl = document.getElementById("story");
const sDots = storyEl.querySelector(".s-dots");
STORY.forEach((_, i) => {
  const d = document.createElement("span");
  d.onclick = () => storyChapter(i);
  sDots.appendChild(d);
});
let storyIdx = -1, storyOn = false;
function storyChapter(i) {
  storyIdx = i;
  const ch = STORY[i];
  const li = LANDMARKS.findIndex((l) => l.name === ch.at);
  if (li >= 0) {
    const l = LANDMARKS[li];
    const tgt = new THREE.Vector3(l.x, l.y + 30, l.z);
    const ang = (i * 1.1) % (Math.PI * 2);
    const pos = tgt.clone().add(new THREE.Vector3(Math.cos(ang) * ch.dist, ch.dist * 0.55, Math.sin(ang) * ch.dist));
    flight = { t: 0, p0: camera.position.clone(), p1: pos, t0: controls.target.clone(), t1: tgt };
  }
  storyEl.classList.remove("show");
  setTimeout(() => {
    storyEl.querySelector(".s-chapter").textContent = `Chapter ${i + 1} of ${STORY.length} · A Day in Kudla`;
    storyEl.querySelector(".s-title").textContent = ch.title;
    storyEl.querySelector(".s-text").textContent = ch.text;
    storyEl.querySelector(".s-prev").style.visibility = i ? "visible" : "hidden";
    storyEl.querySelector(".s-next").textContent = i === STORY.length - 1 ? "Finish ✓" : "Next ▶";
    [...sDots.children].forEach((d, k) => d.classList.toggle("on", k === i));
    storyEl.classList.add("show");
  }, 450);
}
function startStory() {
  storyOn = true;
  closeCard();
  stopTour();
  sidebar.classList.add("hidden");
  toggleBtn.classList.add("shifted");
  controls.autoRotate = !reducedMotion.matches;
  controls.autoRotateSpeed = 0.45;
  storyEl.classList.add("on");
  storyChapter(0);
}
function exitStory() {
  storyOn = false;
  controls.autoRotate = false;
  storyEl.classList.remove("show");
  setTimeout(() => storyEl.classList.remove("on"), 400);
  sidebar.classList.remove("hidden");
  toggleBtn.classList.remove("shifted");
  flyHome();
}
document.getElementById("btnStory").onclick = () => (storyOn ? exitStory() : startStory());
storyEl.querySelector(".s-next").onclick = () => (storyIdx >= STORY.length - 1 ? exitStory() : storyChapter(storyIdx + 1));
storyEl.querySelector(".s-prev").onclick = () => storyIdx > 0 && storyChapter(storyIdx - 1);
storyEl.querySelector(".s-exit").onclick = exitStory;
addEventListener("keydown", (e) => {
  if (!storyOn) return;
  if (e.key === "ArrowRight" || e.key === "Enter") storyEl.querySelector(".s-next").click();
  if (e.key === "ArrowLeft") storyEl.querySelector(".s-prev").click();
  if (e.key === "Escape") exitStory();
});

/* ---- sidebar toggle ---- */
const sidebar = document.getElementById("sidebar");
const toggleBtn = document.getElementById("toggle");
toggleBtn.onclick = () => { sidebar.classList.toggle("hidden"); toggleBtn.classList.toggle("shifted"); };

/* ============================ LOOP ============================ */
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

Miniature.createLife({ THREE, scene, landmarks: LANDMARKS, modelEntries, heightAt, ferry, speedboat, ships });
const clock = new THREE.Clock();
let lastFrame = 0;
function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  const rawDt = elapsed - lastFrame;
  const dt = Math.min(rawDt, 0.05);
  lastFrame = elapsed;
  const t = reducedMotion.matches ? 0 : elapsed;

  if (flight) {
    flight.t += reducedMotion.matches ? 1 : dt / 1.4;
    const k = flight.t >= 1 ? 1 : 1 - Math.pow(1 - flight.t, 3);
    camera.position.lerpVectors(flight.p0, flight.p1, k);
    controls.target.lerpVectors(flight.t0, flight.t1, k);
    if (!reducedMotion.matches) camera.position.y += Math.sin(k * Math.PI) * Math.min(900, flight.p0.distanceTo(flight.p1) * 0.12);
    if (flight.t >= 1) flight = null;
  }
  controls.update();
  // Keep the orbit camera above the same surface as the city.
  const floor = Math.max(0, heightAt(camera.position.x, camera.position.z)) + 45;
  if (camera.position.y < floor) camera.position.y = floor;
  updateSun();
  districtWorld.update(camera, t);
  Miniature.updateWater(t);
  Miniature.updateLife(t, camera);

  ANIMATED.forEach((o) => {
    if (o.userData.wheel) {
      o.rotation.z = t * 0.35;
      o.children.forEach((ch) => { if (ch.userData.cab) ch.rotation.z = -o.rotation.z; });
    }
    if (o.userData.kite) {
      o.position.y = o.userData.kite.baseY + Math.sin(t * 1.3 + o.userData.kite.phase) * 3;
      o.rotation.z = Math.sin(t * 0.9 + o.userData.kite.phase) * 0.35;
    }
    if (o.userData.flame) o.scale.y = 1 + Math.sin(t * 7) * 0.25;
  });

  // ferry back & forth on the Gurupura
  const ft = (Math.sin(t * 0.12) + 1) / 2;
  ferry.position.set(FA.x + (FB.x - FA.x) * ft, 1.5, FA.z + (FB.z - FA.z) * ft);
  ferry.rotation.y = Math.atan2(FB.x - FA.x, FB.z - FA.z) + (Math.cos(t * 0.12) > 0 ? 0 : Math.PI);

  // plane circling the airport
  if (AIRPORT) {
    const a = t * 0.1;
    plane.position.set(AIRPORT.x + Math.cos(a) * 2600, AIRPORT.y + 700, AIRPORT.z + Math.sin(a) * 2600);
    plane.rotation.y = -a;
  }

  // Panambur watersports: speedboat towing the parasailer, jetskis zipping about
  {
    const a = t * 0.22;
    const bx = WS_C.x + Math.cos(a) * 300, bz = WS_C.z + Math.sin(a) * 300;
    speedboat.position.set(bx, 1.2, bz);
    speedboat.rotation.y = -a;
    chute.position.set(WS_C.x + Math.cos(a - 0.45) * 300, 95 + Math.sin(t * 0.8) * 8, WS_C.z + Math.sin(a - 0.45) * 300);
    const j1 = t * 0.5;
    jetskis[0].position.set(WS_C.x + Math.cos(j1) * 150, 1, WS_C.z + 120 + Math.sin(j1) * 110);
    jetskis[0].rotation.y = -j1 + Math.PI / 2;
    const j2 = -t * 0.38;
    jetskis[1].position.set(WS_C.x - 140 + Math.cos(j2) * 110, 1, WS_C.z - 100 + Math.sin(j2) * 130);
    jetskis[1].rotation.y = -j2 - Math.PI / 2;
  }

  // NH-66 traffic
  cars.forEach((c) => {
    const frac = ((c.off + c.dir * t * c.speed / c.path.total) % 1 + 1) % 1;
    const p = placeOnPath(c.path, frac, c.lane);
    c.mesh.position.set(p.x, p.y, p.z);
    c.mesh.rotation.y = p.rot + (c.dir > 0 ? 0 : Math.PI) + Math.PI / 2;
  });
  // cargo ships steaming toward the port
  ships.forEach((s, i) => {
    s.position.z += (reducedMotion.matches ? 0 : dt) * (i ? -1 : 1) * 57.6;
    if (s.position.z > 10000) s.position.z = -30000;
    if (s.position.z < -30000) s.position.z = 10000;
  });

  clouds.forEach((c, i) => {
    c.position.x += (reducedMotion.matches ? 0 : dt * 60) * (1.6 + (i % 3) * 0.5);
    if (c.position.x > TX1 + 3000) c.position.x = TX0 - 3000;
  });

  renderer.render(scene, camera);
  updateLabels();
  Miniature.measureFrame(rawDt, renderer);
}
animate();
</script>
